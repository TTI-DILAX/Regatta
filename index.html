      + '<div style="padding:12px 8px;text-align:center;border-right:1px solid var(--bdr2)"><div style="font-family:var(--fd);font-size:24px;font-weight:900;color:var(--wh);font-variant-numeric:tabular-nums">'+SCKR.core.fmt.speed(speedMs)+'</div><div style="font-family:var(--fd);font-size:9px;color:var(--mut);letter-spacing:.1em;margin-top:3px">km/h</div></div>'
      + '<div style="padding:12px 8px;text-align:center;border-right:1px solid var(--bdr2)"><div style="font-family:var(--fd);font-size:24px;font-weight:900;color:var(--wh)">'+(bft!==null?bft+' Bft':'-')+'</div><div style="font-family:var(--fd);font-size:9px;color:var(--mut);letter-spacing:.1em;margin-top:3px">'+(wdir||'WIND')+'</div></div>'
      + '<div style="padding:12px 8px;text-align:center"><div style="font-family:var(--fd);font-size:24px;font-weight:900;color:'+twaCol+';font-variant-numeric:tabular-nums">'+(twa!==null?(twa>0?"+":"")+Math.round(twa)+"°":"-")+'</div><div style="font-family:var(--fd);font-size:9px;color:var(--mut);letter-spacing:.1em;margin-top:3px">TWA</div></div>'
      + '</div></div>';

    if(roll !== null) {
      // Smooth roll via EMA
      SCKR.regatta._smooth.roll = SCKR.regatta._smooth.roll !== undefined
        ? SCKR.regatta._smooth.roll * 0.7 + roll * 0.3 : roll;
      var sr = SCKR.regatta._smooth.roll;
      var absR = Math.abs(sr);
      var rc = absR>20?"var(--acc)":absR>10?"#e67e22":"#4ecf88";
      var rLabel = sr > 1 ? "LEE" : sr < -1 ? "LUV" : "AUFRECHT";
      var rIcon = sr > 1 ? "&#9661;" : sr < -1 ? "&#9651;" : "&#9670;";
      // Bar: Mitte=0°, max ±30°
      var barPct = Math.max(5,Math.min(95, 50 + (sr/30)*45));
      var barW = Math.max(6,Math.min(40,absR*1.5));
      html += '<div class="pnl" style="padding:10px 14px">'
        + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">'
        + '<div style="font-family:var(--fd);font-size:9px;font-weight:700;letter-spacing:.1em;color:var(--mut)">KRAENGUNG</div>'
        + '<div style="font-family:var(--fd);font-size:22px;font-weight:900;color:'+rc+';margin-left:auto">'+rIcon+' '+absR.toFixed(1)+'°</div>'
        + '<div style="font-family:var(--fd);font-size:11px;font-weight:800;color:'+rc+';min-width:52px">'+rLabel+'</div>'
        + '</div>'
        + '<div style="height:20px;background:var(--bg3);border-radius:6px;position:relative;overflow:hidden">'
        + '<div style="position:absolute;left:25%;top:3px;bottom:3px;width:1px;background:rgba(255,255,255,.15)"></div>'
        + '<div style="position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(255,255,255,.25);transform:translateX(-50%)"></div>'
        + '<div style="position:absolute;left:75%;top:3px;bottom:3px;width:1px;background:rgba(255,255,255,.15)"></div>'
        + '<div style="position:absolute;left:4px;top:50%;transform:translateY(-50%);font-size:7px;color:rgba(255,255,255,.3);font-family:var(--fd);font-weight:700">LUV</div>'
        + '<div style="position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:7px;color:rgba(255,255,255,.3);font-family:var(--fd);font-weight:700">LEE</div>'
        + '<div style="position:absolute;left:'+barPct.toFixed(1)+'%;top:2px;bottom:2px;width:'+barW.toFixed(0)+'px;background:'+rc+';transform:translateX(-50%);border-radius:3px;transition:left .25s ease,width .25s ease,background .2s"></div>'
        + '</div>'
        + (absR>25?'<div style="margin-top:5px;font-family:var(--fd);font-size:10px;font-weight:800;color:var(--acc);letter-spacing:.06em">&#9888; ZU VIEL KRAENGUNG — AUFSCHOTEN!</div>':'')
        + '</div>';
    }

    var recCol = rec.status==="layline_now"||rec.status==="overstand"?"var(--acc)":rec.status==="layline_near"?"#FFCF40":"#4ecf88";
    html += '<div class="pnl" style="border-left:4px solid '+recCol+'"><div class="phd"><span class="phd-t">TAKTIK</span></div><div style="padding:12px 16px">'
      + '<div style="font-family:var(--fd);font-size:16px;font-weight:900;color:'+recCol+';letter-spacing:.04em">'+rec.text.toUpperCase()+'</div>';
    if(adv) html += '<div style="font-size:12px;color:var(--off);margin-top:4px">'+adv.text+'</div>';
    if(course.buoys.length > 0 && SCKR.core.gps.currentPos) {
      var nb = course.buoys[course.currentBuoyIdx]||course.buoys[0];
      if(nb) {
        var dist = Math.round(SCKR.core.util.haversine(SCKR.core.gps.currentPos,{lat:nb.lat,lng:nb.lng})*1000);
        var brng = Math.round(SCKR.core.util.bearing(SCKR.core.gps.currentPos,{lat:nb.lat,lng:nb.lng}));
        html += '<div style="display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--bdr2)"><span style="font-family:var(--fd);font-size:11px;color:var(--mut)">'+esc(nb.name)+'</span><span style="font-family:var(--fd);font-size:13px;font-weight:800;color:var(--wh)">'+dist+'m &mdash; '+brng+'°</span></div>';
      }
    }
    html += '</div></div>';

    var boatKlass = b&&b.klasse?b.klasse:"15er-Jollenkreuzer";
    html += '<div class="pnl"><div class="phd"><span class="phd-t">TRIMM: '+esc(b?b.name:boatKlass)+'</span>'
      + '<button type="button" onclick="SCKR.regatta.compass._openFibel()" style="font-family:var(--fd);font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px;border:1px solid var(--bdr);background:transparent;color:var(--mut);cursor:pointer">FIBEL &#8594;</button>'
      + '</div>';
    if(trimmHint&&trimmHint.summary) html += '<div style="padding:9px 14px;font-size:12px;color:var(--acc2);font-weight:600;line-height:1.5;background:rgba(200,16,46,.05);border-bottom:1px solid var(--bdr2)">'+trimmHint.summary+'</div>';
    if(trimmHint&&trimmHint.hints&&trimmHint.hints.length>0) {
      html += '<div style="padding:6px 14px">';
      for(var hi=0;hi<Math.min(trimmHint.hints.length,5);hi++) {
        var ht=trimmHint.hints[hi], ci=ht.indexOf(":");
        var lbl=ci>-1&&ci<25?ht.slice(0,ci):null, det=ci>-1&&ci<25?ht.slice(ci+1):ht;
        html += '<div style="padding:5px 0;border-bottom:1px solid var(--bdr2);font-size:12px">'+(lbl?'<span style="font-family:var(--fd);font-size:11px;font-weight:800;color:var(--acc2)">'+esc(lbl)+':</span> ':'')+' <span style="color:var(--off)">'+esc(det)+'</span></div>';
      }
      html += '</div>';
    } else { html += '<div style="padding:12px 14px;font-size:12px;color:var(--mut)">GPS + Wind fuer Trimm-Empfehlung aktiv halten</div>'; }
    var selAct = st.propulsion==="Segel"?" active":"";
    var motAct = st.propulsion==="Motor"?" active motor":"";
    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 14px 12px">'
      + '<button class="prop-btn'+selAct+'" type="button" onclick="SCKR.regatta.compass.setPropulsion(&quot;Segel&quot;)">&#9661; SEGEL</button>'
      + '<button class="prop-btn'+motAct+'" type="button" onclick="SCKR.regatta.compass.setPropulsion(&quot;Motor&quot;)">&#9655; MOTOR</button>'
      + '</div></div>';

    el.innerHTML = html;
  },

  startRefresh: function() {
    var st = SCKR.regatta.compass.state;
    if(st.refreshTimer) clearInterval(st.refreshTimer);
    st.refreshTimer = setInterval(function() {
      if(SCKR.core.currentTab === "compass") SCKR.regatta.compass.render();
    }, 1000);
  },

  stopRefresh: function() {
    if(SCKR.regatta.compass.state.refreshTimer) {
      clearInterval(SCKR.regatta.compass.state.refreshTimer);
      SCKR.regatta.compass.state.refreshTimer = null;
    }
  }
};

/* ═══════════════════════════════════════════════════
   TAB 5: TAKTIK (geometrisch, kein Backend)
   ═══════════════════════════════════════════════════ */

SCKR.regatta.taktik = {
  /* Lay-Line: Geometrische Berechnung */
  layLine: function(boatPos, buoy, windDir, tackAngle) {
    /* tackAngle = halber Kreuzwinkel (typisch 22.5 Grad bei 45 Grad Kreuz)
       Lay-Line ist die Linie die das Boot bei optimalem Hoch-am-Wind-Kurs gerade noch
       die Luv-Tonne ohne weitere Wende erreichen kann */
    var bearing = SCKR.core.util.bearing(boatPos, buoy);
    var diff = bearing - windDir;
    while(diff > 180) diff -= 360;
    while(diff < -180) diff += 360;

    // Lay-Line Steuerbord-Bug = Wind + tackAngle, Backbord = Wind - tackAngle
    var laylineStb = (windDir + tackAngle + 180) % 360;
    var laylineBb  = (windDir - tackAngle + 180 + 360) % 360;

    return {
      bearingToBuoy: bearing,
      relativeAngle: diff,
      onLaylineStb: Math.abs(bearing - laylineStb) < 5,
      onLaylineBb:  Math.abs(bearing - laylineBb) < 5,
      windAngle: diff
    };
  },

  /* Empfehlung: jetzt wenden? */
  recommendation: function() {
    var c = SCKR.regatta.chart.state.course;
    var pos = SCKR.core.gps.currentPos;
    if(!pos) return { status: "no_gps", text: "GPS noch nicht aktiv" };
    if(!c.windDir) return { status: "no_wind", text: "Wind-Richtung in Bahn-Editor eingeben" };
    if(c.buoys.length === 0) return { status: "no_course", text: "Noch keine Tonnen gesetzt" };

    var current = c.buoys[c.currentBuoyIdx];
    if(!current) return { status: "no_target", text: "Keine aktuelle Tonne" };

    var dist = SCKR.core.util.haversine(pos, {lat:current.lat,lng:current.lng}) * 1000;
    var bearing = SCKR.core.util.bearing(pos, {lat:current.lat,lng:current.lng});

    // Bestimme aktuellen Bug aus Heading vs Wind
    var heading = SCKR.core.gps.currentHeading;
    var windOrigin = c.windDir;
    var twa = heading - windOrigin;
    while(twa > 180) twa -= 360;
    while(twa < -180) twa += 360;

    // Boot ist auf Steuerbord-Bug wenn Wind von rechts (TWA negativ)
    var onStbTack = twa < 0;

    // Distanz zur Lay-Line (vereinfacht)
    var bearingToBuoyFromWind = bearing - windOrigin;
    while(bearingToBuoyFromWind > 180) bearingToBuoyFromWind -= 360;
    while(bearingToBuoyFromWind < -180) bearingToBuoyFromWind += 360;

    // Wenn Tonne in Luv (TWA zu Tonne klein) und sehr weit links/rechts: Lay-Line erreicht
    var tackAngle = 45;  // Typisch fuer Jollen
    var laylineDistDeg = Math.abs(Math.abs(bearingToBuoyFromWind) - tackAngle);

    if(current.type === "luv") {
      if(laylineDistDeg < 5) {
        return { status: "layline_now", text: "LAY-LINE ERREICHT! Wenden / Hochziehen.", color: "#1AABA0" };
      } else if(laylineDistDeg < 15) {
        return { status: "layline_near", text: "Lay-Line in der Naehe ("+Math.round(laylineDistDeg)+"&#176;)", color: "#FFCF40" };
      } else if(Math.abs(bearingToBuoyFromWind) > tackAngle + 10) {
        return { status: "overstand", text: "Lay-Line ueberschritten - du fahrst zu weit", color: "#C0392B" };
      } else {
        return { status: "still_approach", text: "Weiter kreuzen, Lay-Line in "+Math.round(laylineDistDeg)+"&#176;", color: "var(--off)" };
      }
    } else {
      // Lee oder Raumkurs - simpler: Distanz + Bearing
      return { status: "downwind", text: "Direkter Kurs - "+Math.round(dist)+"m / "+Math.round(bearing)+"&#176;", color: "var(--acc2)" };
    }
  },

  /* Vorteil Bb vs Stb-Bug schaetzen (vereinfacht) */
  tackAdvantage: function() {
    var c = SCKR.regatta.chart.state.course;
    var pos = SCKR.core.gps.currentPos;
    if(!pos || !c.windDir || c.buoys.length===0) return null;
    var current = c.buoys[c.currentBuoyIdx];
    if(!current) return null;

    var bearing = SCKR.core.util.bearing(pos, {lat:current.lat,lng:current.lng});
    var rel = bearing - c.windDir;
    while(rel > 180) rel -= 360;
    while(rel < -180) rel += 360;

    if(Math.abs(rel) < 30 || Math.abs(rel) > 150) return null;  // Nicht im Kreuz/Vor

    if(rel > 0) return { tack: "Steuerbord", text: "Steuerbord-Bug bevorzugt", color:"#27AE60" };
    return { tack: "Backbord", text: "Backbord-Bug bevorzugt", color:"#C0392B" };
  },

  render: function() {
    var el = document.getElementById("taktik");
    if(!el) return;
    var rec = SCKR.regatta.taktik.recommendation();
    var adv = SCKR.regatta.taktik.tackAdvantage();
    var c = SCKR.regatta.chart.state.course;

    var html = '<div class="shead"><div><div class="lxs">Geometrische Hinweise</div><h2>Taktik</h2></div></div>';

    // Status-Box
    var statusBg = rec.color || "var(--mut)";
    html += '<div class="pnl"><div style="padding:18px 16px;text-align:center;border-left:4px solid '+statusBg+'">'
      + '<div style="font-family:var(--fd);font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--mut);margin-bottom:8px">EMPFEHLUNG</div>'
      + '<div style="font-family:var(--fd);font-size:18px;font-weight:800;color:'+statusBg+';line-height:1.4">'+rec.text+'</div>'
      + '</div></div>';

    // Lay-Line Ampel
    if(rec.status === "layline_now") {
      html += '<div class="pnl" style="border:2px solid #1AABA0"><div style="padding:14px;text-align:center;background:rgba(26,171,160,.1)">'
        + '<div style="font-size:32px;margin-bottom:6px">&#x1F7E2;</div>'
        + '<div style="font-family:var(--fd);font-size:18px;font-weight:900;color:#1AABA0;letter-spacing:.06em">JETZT WENDEN</div>'
        + '</div></div>';
    } else if(rec.status === "layline_near") {
      html += '<div class="pnl" style="border:2px solid #FFCF40"><div style="padding:14px;text-align:center;background:rgba(255,207,64,.1)">'
        + '<div style="font-size:32px;margin-bottom:6px">&#x1F7E1;</div>'
        + '<div style="font-family:var(--fd);font-size:18px;font-weight:900;color:#FFCF40;letter-spacing:.06em">VORBEREITEN</div>'
        + '</div></div>';
    } else if(rec.status === "overstand") {
      html += '<div class="pnl" style="border:2px solid #C0392B"><div style="padding:14px;text-align:center;background:rgba(192,57,43,.1)">'
        + '<div style="font-size:32px;margin-bottom:6px">&#x1F534;</div>'
        + '<div style="font-family:var(--fd);font-size:18px;font-weight:900;color:#C0392B;letter-spacing:.06em">LAY-LINE UEBERFAHREN</div>'
        + '</div></div>';
    }

    // Tack advantage
    if(adv) {
      html += '<div class="pnl"><div class="phd"><span class="phd-t">Bug-Vorteil</span></div>'
        + '<div style="padding:14px;text-align:center;color:'+adv.color+';font-family:var(--fd);font-size:16px;font-weight:800">'+adv.text+'</div>'
        + '</div>';
    }

    // Live data
    if(SCKR.core.gps.currentPos && c.buoys.length > 0) {
      var current = c.buoys[c.currentBuoyIdx];
      if(current) {
        var dist = SCKR.core.util.haversine(SCKR.core.gps.currentPos, {lat:current.lat,lng:current.lng}) * 1000;
        var bearing = SCKR.core.util.bearing(SCKR.core.gps.currentPos, {lat:current.lat,lng:current.lng});
        html += '<div class="pnl"><div class="phd"><span class="phd-t">Live-Werte</span></div>'
          + '<div style="display:grid;grid-template-columns:1fr 1fr">'
          +   '<div style="padding:12px;text-align:center;border-right:1px solid var(--bdr2)"><div style="font-family:var(--fd);font-size:24px;font-weight:900;color:var(--wh)">'+Math.round(dist)+'<span style="font-size:11px;color:var(--acc3)">m</span></div><div style="font-size:9px;color:var(--mut);font-family:var(--fd);font-weight:700;letter-spacing:.08em">DISTANZ</div></div>'
          +   '<div style="padding:12px;text-align:center"><div style="font-family:var(--fd);font-size:24px;font-weight:900;color:var(--wh)">'+Math.round(bearing)+'<span style="font-size:11px;color:var(--acc3)">&#176;</span></div><div style="font-size:9px;color:var(--mut);font-family:var(--fd);font-weight:700;letter-spacing:.08em">PEILUNG</div></div>'
          + '</div></div>';
      }
    }

    // Hinweis
    html += '<div class="pnl"><div style="padding:14px;font-size:11px;color:var(--mut);line-height:1.6">'
      + '<b style="color:var(--acc3)">HINWEIS:</b> Berechnungen sind geometrisch (45&#176; Kreuzwinkel angenommen). Echte Polar-Kurven kommen mit der KI-Analyse in einer spaeteren Version.'
      + '</div></div>';

    el.innerHTML = html;
  }
};

/* ═══════════════════════════════════════════════════
   TAB 6: TRIMM (Logger + Claude API + Fibel)
   ═══════════════════════════════════════════════════ */

SCKR.regatta.trimm = {
  state: {
    logging: false,
    log: [],
    sessionStart: null,
    showFibel: null,
    // Race session tracking
    raceActive: false,
    raceStart: null,
    raceEnd: null,
    wendCount: 0,
    halseCount: 0,
    tonneCount: 0,
    gustCount: 0,
    speedSamples: [],
    maxSpeed: 0,
    avgSpeed: 0,
    windDir: null,
    startDelay: null,   // Sekunden nach Start-Signal
    savedSessions: []   // gespeicherte Wettfahrten
  },

  /* Logging Events (event-basiert, nicht sekuendlich) */
  logEvent: function(type, value) {
    if(!SCKR.regatta.trimm.state.logging) return;
    var st = SCKR.regatta.trimm.state;
    var entry = {
      t: new Date().toISOString(),
      type: type,                                 // wende, halse, schwert, achterstag, traveller, manuell, gust
      value: value || null,
      pos: SCKR.core.gps.currentPos,
      heading: SCKR.core.gps.currentHeading,
      speed: SCKR.core.gps.currentSpeed,
      heel: SCKR.core.orient.enabled ? SCKR.core.orient.roll : null,
      twa: SCKR.regatta.compass.twa(),
      wind: SCKR.regatta.compass.state.windData
    };
    st.log.push(entry);
    if(st.raceActive) {
      if(type==="wende") st.wendCount++;
      if(type==="halse") st.halseCount++;
      if(type==="gust")  st.gustCount++;
    }
    SCKR.core.ui.toast("LOG: " + type);
    SCKR.core.ui.vibrate(30);
  },

  /* ── RACE SESSION ── */
  startRace: function() {
    var st = SCKR.regatta.trimm.state;
    st.raceActive = true;
    st.raceStart = Date.now();
    st.raceEnd = null;
    st.wendCount = 0; st.halseCount = 0; st.tonneCount = 0; st.gustCount = 0;
    st.speedSamples = []; st.maxSpeed = 0; st.avgSpeed = 0;
    st.windDir = SCKR.regatta.compass.state.windData ? SCKR.regatta.compass.state.windData.dir : null;
    // Auto-start trimm logging
    if(!st.logging) SCKR.regatta.trimm.startLogging();
    SCKR.core.ui.toast("WETTFAHRT GESTARTET");
    SCKR.core.ui.vibrate(60);
  },

  stopRace: function() {
    var st = SCKR.regatta.trimm.state;
    if(!st.raceActive) return;
    st.raceEnd = Date.now();
    st.raceActive = false;
    // Calc avg speed
    if(st.speedSamples.length > 0)
      st.avgSpeed = st.speedSamples.reduce(function(a,b){return a+b;},0)/st.speedSamples.length;
    // Save session
    var session = {
      id: Date.now(),
      date: new Date(st.raceStart).toLocaleDateString('de-DE'),
      time: new Date(st.raceStart).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}),
      durationSec: Math.round((st.raceEnd - st.raceStart)/1000),
      wendCount: st.wendCount,
      halseCount: st.halseCount,
      tonneCount: st.tonneCount,
      gustCount: st.gustCount,
      maxSpeed: st.maxSpeed,
      avgSpeed: st.avgSpeed,
      windDir: st.windDir,
      log: st.log.slice()
    };
    st.savedSessions.unshift(session);
    // Persist
    SCKR.core.storage.set("regatta_sessions", st.savedSessions);
    SCKR.core.ui.toast("WETTFAHRT GESPEICHERT");
    SCKR.core.ui.vibrate([100,50,100]);
    SCKR.regatta.trimm.stopLogging && SCKR.regatta.trimm.stopLogging();
    return session;
  },

  trackSpeed: function() {
    var st = SCKR.regatta.trimm.state;
    if(!st.raceActive) return;
    var spd = SCKR.core.gps.currentSpeed * 3.6; // km/h
    if(spd > 0.5) {
      st.speedSamples.push(spd);
      if(spd > st.maxSpeed) st.maxSpeed = spd;
      if(st.speedSamples.length > 500) st.speedSamples.shift();
    }
  },

  liveStats: function() {
    var st = SCKR.regatta.trimm.state;
    if(!st.raceActive) return null;
    var elapsed = Math.round((Date.now() - st.raceStart)/1000);
    var avg = st.speedSamples.length > 0
      ? (st.speedSamples.reduce(function(a,b){return a+b;},0)/st.speedSamples.length).toFixed(1)
      : "0.0";
    return {
      elapsed: elapsed,
      wenden: st.wendCount,
      halsen: st.halseCount,
      tonnen: st.tonneCount,
      boeen: st.gustCount,
      maxSpeed: st.maxSpeed.toFixed(1),
      avgSpeed: avg,
      windDir: st.windDir
    };
  },

  startLogging: function() {
    var b = SCKR.core.boats.active();
    if(!b) { SCKR.core.ui.toast("KEIN BOOT - IM FAHRTENBUCH ANLEGEN"); return; }
    SCKR.regatta.trimm.state.logging = true;
    SCKR.regatta.trimm.state.log = [];
    SCKR.regatta.trimm.state.sessionStart = new Date().toISOString();
    SCKR.core.ui.toast("LOGGING GESTARTET");
    SCKR.regatta.trimm.render();
  },

  stopLogging: async function() {
    var st = SCKR.regatta.trimm.state;
    st.logging = false;
    if(st.log.length > 0) {
      var b = SCKR.core.boats.active();
      var session = {
        id: SCKR.core.util.uuid(),
        boatId: b ? b.id : null,
        boatClass: b ? b.boatClass : "",
        start: st.sessionStart,
        end: new Date().toISOString(),
        events: st.log
      };
      await SCKR.core.storage.set("trimm:" + session.id, session);
      SCKR.core.ui.toast("SESSION GESPEICHERT - "+st.log.length+" EVENTS");
    }
    st.log = [];
    SCKR.regatta.trimm.render();
  },

  /* Claude API Hook fuer Trimm-Analyse */
  analyzeWithClaude: async function() {
    var key = SCKR.config.anthropicAPIKey;
    if(!key) {
      SCKR.core.ui.toast("CLAUDE API-KEY NOETIG - ADMIN-PANEL IM FAHRTENBUCH");
      return;
    }
    var st = SCKR.regatta.trimm.state;
    if(st.log.length === 0) {
      SCKR.core.ui.toast("KEINE DATEN ZUM ANALYSIEREN");
      return;
    }
    var b = SCKR.core.boats.active();
    if(!b) return;

    SCKR.core.ui.toast("CLAUDE ANALYSIERT...");

    var prompt = "Du bist Trimmberater fuer eine "+b.boatClass+" Jolle. "
      + "Hier sind die Messdaten der letzten Trainingsphase (Speed in Knoten, Heel in Grad, TWA = True Wind Angle): "
      + JSON.stringify(st.log.slice(-50))   // Letzte 50 Events
      + " Erkenne Trimmfehler und gib 3-5 konkrete Empfehlungen auf Deutsch.";

    try {
      var r = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": key,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({
          model: "claude-haiku-4-5-20251001",
          max_tokens: 800,
          messages: [{role:"user", content: prompt}]
        })
      });
      if(!r.ok) throw new Error("HTTP " + r.status);
      var data = await r.json();
      var text = data.content[0].text;
      SCKR.core.ui.openSheet(
        '<div class="sheet-hd"><h3>Claude Analyse</h3><button class="sheet-close" type="button" onclick="SCKR.core.ui.closeSheet()">SCHLIESSEN</button></div>'
        + '<div class="pnl"><div style="padding:16px;font-size:14px;line-height:1.7;color:var(--off);white-space:pre-wrap">' + SCKR.core.fmt.esc(text) + '</div></div>'
      );
    } catch(e) {
      SCKR.core.ui.toast("FEHLER: " + e.message, 4000);
    }
  },

  showFibel: function(key) {
    var fibel = SCKR.core.trimmFibel[key];
    if(!fibel) { SCKR.core.ui.toast("KEINE FIBEL FUER DIESE KLASSE"); return; }

    if(fibel._placeholder) {
      SCKR.core.ui.openSheet(
        '<div class="sheet-hd"><h3>'+SCKR.core.fmt.esc(fibel.klasse)+'</h3><button class="sheet-close" type="button" onclick="SCKR.core.ui.closeSheet()">SCHLIESSEN</button></div>'
        + '<div class="pnl"><div style="padding:30px 20px;text-align:center">'
        + '<div style="font-family:var(--fd);font-size:18px;font-weight:700;color:var(--wh);margin-bottom:10px">In Vorbereitung</div>'
        + '<div style="font-size:13px;color:var(--mut);line-height:1.6">'+SCKR.core.fmt.esc(fibel._placeholder)+'</div>'
        + '</div></div>'
      );
      return;
    }

    var html = '<div class="sheet-hd"><h3>'+SCKR.core.fmt.esc(fibel.klasse)+'</h3><button class="sheet-close" type="button" onclick="SCKR.core.ui.closeSheet()">SCHLIESSEN</button></div>';

    var sections = ["leichtwind","mittelwind","starkwind","raumkurs","wende","trimm_speziell"];
    for(var i=0;i<sections.length;i++) {
      var s = fibel[sections[i]];
      if(!s) continue;
      html += '<div class="pnl"><div class="phd"><span class="phd-t">'+SCKR.core.fmt.esc(s.titel)+'</span></div>';
      html += '<div style="padding:12px 14px">';
      for(var j=0;j<s.tipps.length;j++) {
        html += '<div style="font-size:13px;color:var(--off);padding:5px 0 5px 18px;line-height:1.5;position:relative">'
          + '<span style="position:absolute;left:0;color:var(--acc)">&#8226;</span>'+SCKR.core.fmt.esc(s.tipps[j])
          + '</div>';
      }
      html += '</div></div>';
    }

    SCKR.core.ui.openSheet(html);
  },

  render: function() {
    var el = document.getElementById("trimm");
    if(!el) return;
    var st = SCKR.regatta.trimm.state;
    var b = SCKR.core.boats.active();
    var hasKey = !!SCKR.config.anthropicAPIKey;

    var html = '<div class="shead"><div><div class="lxs">'+(b ? b.boatClass : "Kein Boot")+'</div><h2>Trimm</h2></div></div>';

    // Logger
    html += '<div class="pnl"><div class="phd"><span class="phd-t">Trimm-Log '+(st.logging?"AKTIV":"")+'</span>'
      +   (st.logging?'<div style="margin-left:auto;width:8px;height:8px;background:var(--teal);border-radius:50%;animation:buoyPulse 1s infinite"></div>':'')
      + '</div>'
      + '<div style="padding:10px 14px;font-size:12px;color:var(--mut);line-height:1.5">Events werden bei Aktion geloggt (Wende, Trimm-Aenderung, Boe). Keine sekuendliche Aufzeichnung.</div>';

    if(st.logging) {
      html += '<div style="padding:0 10px 10px;display:grid;grid-template-columns:1fr 1fr;gap:6px">'
        +     '<button class="btn-sm" onclick="SCKR.regatta.trimm.logEvent(\'wende\')" style="padding:9px;font-size:11px;border-radius:6px;background:rgba(200,16,46,.1);color:var(--wh);border:1px solid var(--bdr);cursor:pointer">WENDE</button>'
        +     '<button class="btn-sm" onclick="SCKR.regatta.trimm.logEvent(\'halse\')" style="padding:9px;font-size:11px;border-radius:6px;background:rgba(200,16,46,.1);color:var(--wh);border:1px solid var(--bdr);cursor:pointer">HALSE</button>'
        +     '<button class="btn-sm" onclick="SCKR.regatta.trimm.logEvent(\'schwert_hoch\')" style="padding:9px;font-size:11px;border-radius:6px;background:rgba(26,171,160,.15);color:var(--teal);border:1px solid var(--bdr2);cursor:pointer">SCHWERT &#8593;</button>'
        +     '<button class="btn-sm" onclick="SCKR.regatta.trimm.logEvent(\'schwert_tief\')" style="padding:9px;font-size:11px;border-radius:6px;background:rgba(26,171,160,.15);color:var(--teal);border:1px solid var(--bdr2);cursor:pointer">SCHWERT &#8595;</button>'
        +     '<button class="btn-sm" onclick="SCKR.regatta.trimm.logEvent(\'achterstag_an\')" style="padding:9px;font-size:11px;border-radius:6px;background:rgba(230,126,34,.15);color:#e67e22;border:1px solid var(--bdr2);cursor:pointer">ACHTERSTAG +</button>'
        +     '<button class="btn-sm" onclick="SCKR.regatta.trimm.logEvent(\'achterstag_los\')" style="padding:9px;font-size:11px;border-radius:6px;background:rgba(230,126,34,.15);color:#e67e22;border:1px solid var(--bdr2);cursor:pointer">ACHTERSTAG -</button>'
        +     '<button class="btn-sm" onclick="SCKR.regatta.trimm.logEvent(\'traveller_luv\')" style="padding:9px;font-size:11px;border-radius:6px;background:rgba(155,89,182,.15);color:#9B59B6;border:1px solid var(--bdr2);cursor:pointer">TRAVELLER L</button>'
        +     '<button class="btn-sm" onclick="SCKR.regatta.trimm.logEvent(\'traveller_lee\')" style="padding:9px;font-size:11px;border-radius:6px;background:rgba(155,89,182,.15);color:#9B59B6;border:1px solid var(--bdr2);cursor:pointer">TRAVELLER L-E</button>'
        +     '<button class="btn-sm" onclick="SCKR.regatta.trimm.logEvent(\'gust\')" style="padding:9px;font-size:11px;border-radius:6px;background:rgba(192,57,43,.15);color:var(--red);border:1px solid var(--bdr2);cursor:pointer">BOE</button>'
        +     '<button class="btn-sm" onclick="SCKR.regatta.trimm.logEvent(\'manuell\')" style="padding:9px;font-size:11px;border-radius:6px;background:rgba(255,255,255,.05);color:var(--mut);border:1px solid var(--bdr2);cursor:pointer">SONST.</button>'
        + '</div>'
        + '<div style="padding:0 10px 10px;font-size:11px;color:var(--mut);text-align:center">'+st.log.length+' Events geloggt</div>';
    }

    html += '<div style="padding:0 10px 12px">'
      +   (st.logging
            ? '<button class="btn btn-red" type="button" onclick="SCKR.regatta.trimm.stopLogging()" style="font-size:13px;padding:11px">LOGGING BEENDEN &amp; SPEICHERN</button>'
            : '<button class="btn btn-gold" type="button" onclick="SCKR.regatta.trimm.startLogging()" style="font-size:13px;padding:11px">LOGGING STARTEN</button>')
      + '</div></div>';

    // Claude Analyse
    if(st.log.length > 5 || (!st.logging && st.sessionStart)) {
      html += '<div class="pnl"><div class="phd"><span class="phd-t">KI-Analyse (Claude)</span></div>'
        + '<div style="padding:10px 14px;font-size:12px;color:var(--mut);line-height:1.5">'
        + (hasKey ? "API-Key gesetzt. Klicke um Analyse durchzufuehren (~0.01-0.05 EUR pro Lauf)." : "API-Key fehlt. Im Fahrtenbuch-Admin eintragen.")
        + '</div>'
        + '<div style="padding:0 10px 10px"><button class="btn '+(hasKey?"btn-teal":"btn-ghost")+'" type="button" onclick="SCKR.regatta.trimm.analyzeWithClaude()" style="font-size:13px;padding:11px"'+(hasKey?'':' disabled style="opacity:.4"')+'>'+(hasKey?'TRIMM ANALYSIEREN':'API-KEY FEHLT')+'</button></div>'
        + '</div>';
    }

    // Fibel - alle Klassen
    html += '<div class="pnl"><div class="phd"><span class="phd-t">Trimm-Fibel</span></div>';
    var classes = [
      {key:"15er-Jollenkreuzer", label:"15er Jollenkreuzer", featured:true},
      {key:"H-Jolle", label:"H-Jolle"},
      {key:"Pirat", label:"Pirat"},
      {key:"420er", label:"420er"},
      {key:"Laser", label:"Laser/ILCA"},
      {key:"Optimist", label:"Optimist"}
    ];
    for(var i=0;i<classes.length;i++) {
      var cl = classes[i];
      var fibel = SCKR.core.trimmFibel[cl.key];
      var hasContent = fibel && !fibel._placeholder;
      html += '<div style="padding:11px 14px;border-bottom:1px solid var(--bdr2);display:flex;align-items:center;justify-content:space-between;cursor:pointer" onclick="SCKR.regatta.trimm.showFibel(\''+cl.key+'\')">'
        + '<div><div style="font-weight:600;font-size:14px">'+cl.label+'</div>'
        + '<div style="font-size:11px;color:'+(hasContent?"var(--teal)":"var(--mut)")+';margin-top:2px">'+(hasContent?"Komplette Empfehlungen":"Platzhalter - kommt spaeter")+'</div></div>'
        + '<span style="color:var(--acc);font-size:18px">&rsaquo;</span>'
        + '</div>';
    }
    html += '</div>';

    el.innerHTML = html;
  }
};


/* ═══════════════════════════════════════════════════
   TAB 3-6: PLATZHALTER (Session 2 + 3)
   ═══════════════════════════════════════════════════ */

SCKR.regatta.placeholder = function(tabId, title, text, sessionInfo) {
  var el = document.getElementById(tabId);
  if(!el) return;
  el.innerHTML = '<div class="shead"><div><div class="lxs">'+sessionInfo+'</div><h2>'+title+'</h2></div></div>'
    + '<div class="pnl"><div class="coming-soon">'
    + '<div class="coming-soon-icon">&#x26F5;</div>'
    + '<div class="coming-soon-title">In Vorbereitung</div>'
    + '<div class="coming-soon-text">'+text+'</div>'
    + '</div></div>';
};

/* ═══════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════ */

(async function() {
  // Tab Handler registrieren
  SCKR.core.registerTab("timer",   function(){ SCKR.regatta.timer.render(); });
  SCKR.core.registerTab("flags",   function(){ SCKR.regatta.flagsTab.render(); });
  SCKR.core.registerTab("chart",   function(){ SCKR.regatta.chart.render(); });
  SCKR.core.registerTab("compass", function(){ SCKR.regatta.compass.render(); SCKR.regatta.compass.startRefresh(); });
  SCKR.core.registerTab("taktik",  function(){ SCKR.regatta.taktik.render(); });
  SCKR.core.registerTab("trimm",   function(){ SCKR.regatta.trimm.render(); });
  SCKR.core.registerTab("stats",   function(){ SCKR.regatta.stats.render(); });

  // Profile + Boote laden (geteilt mit Fahrtenbuch)
  await SCKR.core.profile.load();
  await SCKR.core.boats.load();

  // Regatta-Kurs laden falls vorhanden
  await SCKR.regatta.chart.loadCourse();

  // Branding laden falls Admin in Fahrtenbuch geaendert
  var branding = await SCKR.core.storage.get("admin_branding");
  if(branding && branding.clubName) {
    var c = document.getElementById("club-name");
    if(c) c.textContent = branding.clubName;
  }

  // Initial render
  SCKR.regatta.timer.render();
})();
</script>
