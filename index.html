<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#061828">
<title>SCKR Regatta 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Libre+Baskerville:wght@400;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root {
  /* ═══ 3 VEREINSFARBEN - Admin-konfigurierbar ═══ */
  --club-accent: #C8102E;
  --club-header: #1a1a1a;
  --club-second: #8B0B1F;

  /* Funktionsfarben */
  --green:  #1A8A50;
  --red:    #C0392B;
  --orange: #e67e22;

  /* Typografie + Radien */
  --fd: 'Barlow Condensed',sans-serif;
  --fs: 'Libre Baskerville',serif;
  --fb: 'Barlow',sans-serif;
  --r:  6px;
  --r2: 12px;
}

/* ══ HELL-MODUS ══ */
[data-theme="light"] {
  --bg:      #F6F6F6;
  --bg2:     #FFFFFF;
  --bg3:     #EFEFEF;
  --surface: #FFFFFF;
  --acc:     var(--club-accent);
  --acc2:    var(--club-second);
  --acc3:    var(--club-second);
  --teal:    #1E6FBF;
  --nav:     var(--club-header);
  --wh:      var(--club-text, #1a1a1a);
  --nav-text: var(--club-nav-text, #FFFFFF);
  --off:     var(--club-off, #444444);
  --mut:     var(--club-mut, #999999);
  --bdr:     #E5E5E5;
  --bdr2:    rgba(200,16,46,.1);
  --shadow:  0 1px 8px rgba(0,0,0,.07);
}

/* ══ DUNKEL-MODUS (Standard fuer Regatta - auf dem Wasser) ══ */
[data-theme="dark"] {
  --bg:      #141414;
  --bg2:     #1e1e1e;
  --bg3:     #272727;
  --surface: #1e1e1e;
  --acc:     var(--club-accent);
  --acc2:    var(--club-second);
  --acc3:    var(--club-second);
  --teal:    #2d7fd4;
  --nav:     var(--club-header);
  --wh:      var(--club-text, #F0F0F0);
  --nav-text: var(--club-nav-text, #FFFFFF);
  --off:     var(--club-off, #AAAAAA);
  --mut:     var(--club-mut, #666666);
  --bdr:     rgba(255,255,255,.09);
  --bdr2:    rgba(200,16,46,.15);
  --shadow:  0 2px 12px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font-family:var(--fb);background:var(--bg);color:var(--wh);max-width:520px;margin:0 auto;min-height:100dvh;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse 100% 60% at 50% 0%,rgba(22,53,85,.9),transparent 65%),repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(200,168,75,.04) 40px),repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(200,168,75,.04) 40px);}
button,input,select,textarea{font-family:var(--fb);color:inherit;-webkit-appearance:none}
.leaflet-container{background:var(--bg2)!important}

/* HEADER */
.hdr{position:sticky;top:0;z-index:50;background:var(--nav);border-bottom:3px solid var(--acc);padding-top:env(safe-area-inset-top)}
.hdr-top{display:flex;align-items:center;gap:12px;padding:11px 16px}
.hdr-logo{width:44px;height:44px;flex-shrink:0;border-radius:50%;cursor:pointer;border:1.5px solid var(--acc3);filter:drop-shadow(0 0 8px rgba(200,168,75,.35));display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--bg2)}
.hdr-logo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.hdr-text{flex:1;min-width:0}
.hdr-text .club{font-family:var(--fd);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc3);line-height:1}
.hdr-text .title{font-family:var(--fs);font-size:15px;font-weight:700;color:var(--wh);line-height:1.25}
.hdr-link{font-family:var(--fd);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--acc);background:var(--bg3);border:1px solid var(--bdr);border-radius:4px;padding:5px 9px;cursor:pointer;text-decoration:none}

/* TABS */
.tabs{display:grid;grid-template-columns:repeat(7,1fr)}
.tab{background:transparent;border:none;border-top:2px solid transparent;color:var(--mut);font-family:var(--fd);font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tab svg{width:16px;height:16px;fill:currentColor}
.tab.active{color:var(--acc);border-top-color:var(--acc)}

.tabbar-fixed{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:var(--nav);;border-top:3px solid var(--acc);z-index:50;padding-bottom:env(safe-area-inset-bottom)}

/* SCREENS */
.screen{padding:16px 14px calc(100px + env(safe-area-inset-bottom));display:none}
.screen.active{display:block}
.shead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--bdr2)}
.shead h2{font-family:var(--fd);font-weight:800;font-size:24px}
.lxs{font-family:var(--fd);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--acc3)}

/* PANEL */
.pnl{background:var(--surface);border:1px solid var(--bdr);border-radius:var(--r2);overflow:hidden;margin-bottom:12px;}
.phd{padding:9px 16px;background:var(--bg3);border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:8px}
.phd::before{content:'';width:2px;height:12px;background:var(--acc);border-radius:2px}
.phd-t{font-family:var(--fd);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}

/* BUTTONS */
.btn{width:100%;padding:14px;border-radius:var(--r);border:none;font-family:var(--fd);font-size:16px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.btn:active{opacity:.82}
.btn-gold{background:linear-gradient(135deg,var(--acc2),var(--acc),var(--acc3));color:var(--bg)}
.btn-green{background:var(--green);color:#fff}
.btn-red{background:var(--red);color:#fff}
.btn-teal{background:var(--teal);color:#fff}
.btn-ghost{background:transparent;color:var(--acc);border:1px solid var(--bdr);font-size:14px}

/* TIMER DISPLAY */
.timer-hero{background:var(--surface);border:1px solid var(--bdr);border-radius:var(--r2);padding:32px 20px 24px;text-align:center;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.timer-status{font-family:var(--fd);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc3);margin-bottom:8px}
.timer-mmss{font-family:var(--fd);font-size:96px;font-weight:900;line-height:1;color:var(--wh);font-variant-numeric:tabular-nums;letter-spacing:-.04em;text-shadow:0 0 40px rgba(200,168,75,.5);margin-bottom:8px}
.timer-mmss.warn{color:var(--orange);text-shadow:0 0 40px rgba(230,126,34,.6)}
.timer-mmss.danger{color:var(--red);text-shadow:0 0 40px rgba(192,57,43,.7)}
.timer-flag-name{font-family:var(--fd);font-size:13px;font-weight:600;color:var(--off);letter-spacing:.06em}

/* FLAG DISPLAY */
.flag-disp{margin:14px auto 0;display:flex;align-items:center;justify-content:center;gap:12px}
.flag-svg{width:60px;height:42px;border:2px solid #03101e;box-shadow:0 4px 16px rgba(0,0,0,.5);border-radius:2px}
.flag-info{text-align:left}
.flag-letter{font-family:var(--fd);font-size:32px;font-weight:900;color:var(--wh);line-height:1}
.flag-meaning{font-size:12px;color:var(--mut);margin-top:2px}

/* TIMER CONTROLS */
.timer-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}

/* FLAG GRID */
.flag-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:10px}
.flag-card{background:var(--surface);border:1px solid var(--bdr2);border-radius:8px;padding:10px;cursor:pointer;display:flex;align-items:center;gap:10px}
.flag-card:active{border-color:var(--acc)}
.flag-card .flag-svg{width:44px;height:30px;flex-shrink:0}
.flag-card-info{flex:1;min-width:0}
.flag-card-letter{font-family:var(--fd);font-size:16px;font-weight:800;color:var(--wh);line-height:1}
.flag-card-name{font-size:11px;color:var(--mut);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* PLACEHOLDER PANELS */
.coming-soon{padding:40px 20px;text-align:center}
.coming-soon-icon{font-size:48px;opacity:.2;margin-bottom:10px}
.coming-soon-title{font-family:var(--fd);font-size:18px;font-weight:700;letter-spacing:.06em;color:var(--wh);margin-bottom:6px}
.coming-soon-text{font-size:13px;color:var(--mut);line-height:1.6}

/* GROUP TITLE */
.group-title{font-family:var(--fd);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);padding:10px 14px 4px}

/* SHEET */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:900;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.sheet-bg.open{display:flex}
.sheet{background:var(--bg2);border:1px solid var(--bdr);border-bottom:none;width:100%;max-width:520px;max-height:92dvh;border-radius:20px 20px 0 0;padding:20px 14px calc(28px + env(safe-area-inset-bottom));overflow-y:auto;animation:su .28s cubic-bezier(.2,.8,.3,1)}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes buoyPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.15);opacity:.85}}
.buoy-pulse{animation:buoyPulse 1.5s ease-in-out infinite}
.sheet-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--bdr2)}
.sheet-hd h3{font-family:var(--fd);font-size:18px;font-weight:800;letter-spacing:.04em}
.sheet-close{border:1px solid var(--bdr2);background:rgba(255,255,255,.05);color:var(--mut);font-size:12px;cursor:pointer;padding:5px 12px;border-radius:6px;font-weight:600;font-family:var(--fd);letter-spacing:.05em}

/* TOAST */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--nav);border:1px solid var(--bdr);color:var(--wh);padding:10px 20px;border-radius:8px;font-family:var(--fd);font-size:14px;font-weight:600;z-index:1000;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:90vw}
.toast.show{opacity:1}

/* FLAG DETAIL IN SHEET */
.flag-detail{padding:20px 14px;text-align:center}
.flag-detail .flag-svg-big{width:160px;height:110px;margin:0 auto 16px;border:2px solid #03101e;box-shadow:0 8px 32px rgba(0,0,0,.6);border-radius:3px}
.flag-detail-letter{font-family:var(--fd);font-size:36px;font-weight:900;color:var(--wh);margin-bottom:4px}
.flag-detail-name{font-family:var(--fb);font-size:14px;color:var(--mut);margin-bottom:14px;letter-spacing:.04em}
.flag-detail-meaning{font-size:15px;line-height:1.5;color:var(--off);text-align:left;background:rgba(200,168,75,.05);border-left:3px solid var(--acc);padding:12px 14px;border-radius:0 6px 6px 0}

/* IDLE MSG */
.idle-msg{padding:24px 16px;text-align:center;color:var(--mut);font-size:13px;line-height:1.7}

/* LANDSCAPE */
@media(orientation:landscape) and (max-height:500px){
  body{max-width:100%}
  .hdr{position:fixed;top:0;left:0;bottom:0;width:64px;border-right:1px solid var(--acc3);border-bottom:none;padding-top:env(safe-area-inset-top)}
  .hdr-top{flex-direction:column;padding:12px 8px;gap:8px}
  .hdr-text{display:none}
  .tabs{grid-template-columns:1fr;grid-template-rows:repeat(6,1fr)}
  .tab{border-top:none;border-left:2px solid transparent;padding:8px 6px}
  .tab.active{border-left-color:var(--acc);border-top-color:transparent}
  .screen{margin-left:64px;padding:14px 12px 80px}
  .tabbar-fixed{display:none}
  .timer-mmss{font-size:72px}
  .flag-grid{grid-template-columns:repeat(4,1fr)}
}

/* ── REGATTA HELL-MODUS OVERRIDES ── */
[data-theme="light"] .pnl { box-shadow: var(--shadow); }
[data-theme="light"] .timer-mmss { color: var(--wh); text-shadow: none; }
[data-theme="light"] .timer-mmss.warn { color: var(--orange); }
[data-theme="light"] .timer-mmss.danger { color: var(--red); }
[data-theme="light"] .race-val-num { color: var(--wh); text-shadow: none; }
[data-theme="light"] .race-buoy-dist { color: var(--acc); }
[data-theme="light"] .tab { color: rgba(255,255,255,.5); }
[data-theme="light"] .tab.active { color: #fff; }
[data-theme="light"] .flag-card { background: var(--surface); border-color: var(--bdr); }
[data-theme="light"] .flag-card:active { border-color: var(--acc); background: rgba(200,16,46,.05); }
[data-theme="light"] .race-buoy { background: var(--surface); }
[data-theme="light"] .race-compass { background: var(--surface); border-color: var(--bdr); }
[data-theme="light"] .race-val { background: var(--surface); border-color: var(--bdr); }
[data-theme="light"] .race-heel { background: var(--surface); border-color: var(--bdr); }
[data-theme="light"] .race-action-btn { background: var(--bg3); border-color: var(--bdr); color: var(--off); }
[data-theme="light"] .timer-hero { background: var(--surface); border-color: var(--bdr); }
[data-theme="light"] .btn-gold { background: var(--acc); color: #fff; box-shadow: 0 4px 16px rgba(200,16,46,.25); }
[data-theme="light"] .btn-ghost { color: var(--acc); border-color: var(--acc); }
[data-theme="light"] .btn-green { background: #16a34a; }
[data-theme="light"] .btn-teal { background: var(--teal); }
[data-theme="light"] .sheet { box-shadow: 0 -8px 40px rgba(0,0,0,.12); }
[data-theme="light"] .race-status-btn { background: rgba(200,16,46,.08); border-color: rgba(200,16,46,.2); color: var(--acc); }
[data-theme="light"] .hdr-link { color: rgba(255,255,255,.8); border-color: rgba(255,255,255,.2); }
[data-theme="light"] .group-title { color: var(--acc); }
</style>
</head>
<body>
<script>
(function(){
  var t = localStorage.getItem('sckr_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', t);
  var btn = document.getElementById('theme-btn');
  if(btn) btn.innerHTML = t === 'dark' ? '&#9728;' : '&#9790;';
  // Farben aus Fahrtenbuch-Admin laden (geteilt via localStorage)
  var colorMap = {
    'acc':'--club-accent', 'hdr':'--club-header', 'sec':'--club-second',
    'navtxt':'--club-nav-text', 'txt':'--club-text',
    'off':'--off', 'mut':'--mut'
  };
  Object.keys(colorMap).forEach(function(k){
    var v = localStorage.getItem('sckr_color_'+k+'_'+t);
    if(v) document.documentElement.style.setProperty(colorMap[k], v);
  });

/* ═══════════════════════════════════════════════════
   TAB 8: STATISTIKEN - Wettfahrt-Auswertung
   ═══════════════════════════════════════════════════ */
SCKR.regatta.stats = {

  render: function() {
    var el = document.getElementById("stats");
    if(!el) return;
    var st = SCKR.regatta.trimm.state;
    var sessions = st.savedSessions || [];
    var esc = SCKR.core.fmt.esc;

    var html = '<div style="padding:16px 14px 100px">';

    // ── Live Race Control ────────────────────────
    html += '<div class="pnl">';
    html += '<div class="phd"><span class="phd-t">'+(st.raceActive?"WETTFAHRT AKTIV":"WETTFAHRT STARTEN")+'</span></div>';

    if(!st.raceActive) {
      html += '<div style="padding:12px 14px">'
        + '<button class="btn btn-red" type="button" onclick="SCKR.regatta.trimm.startRace();SCKR.regatta.stats.render()" style="margin-bottom:8px">&#9654; WETTFAHRT STARTEN</button>'
        + '<div style="font-size:12px;color:var(--mut);line-height:1.6">Startet Zeitmessung, Wende-/Halsen-Zaehlung und Trimm-Logging automatisch.</div>'
        + '</div>';
    } else {
      // Live stats
      var ls = SCKR.regatta.trimm.liveStats();
      var elapsed = ls ? SCKR.core.fmt.time(ls.elapsed) : "--";
      html += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--bdr2)">';
      html += '<div style="padding:14px 8px;text-align:center;border-right:1px solid var(--bdr2)"><div style="font-family:var(--fd);font-size:28px;font-weight:900;color:var(--acc)">'+(ls?ls.wenden:0)+'</div><div style="font-family:var(--fd);font-size:9px;color:var(--mut);letter-spacing:.1em;margin-top:3px">WENDEN</div></div>';
      html += '<div style="padding:14px 8px;text-align:center;border-right:1px solid var(--bdr2)"><div style="font-family:var(--fd);font-size:28px;font-weight:900;color:var(--teal)">'+(ls?ls.halsen:0)+'</div><div style="font-family:var(--fd);font-size:9px;color:var(--mut);letter-spacing:.1em;margin-top:3px">HALSEN</div></div>';
      html += '<div style="padding:14px 8px;text-align:center"><div style="font-family:var(--fd);font-size:28px;font-weight:900;color:var(--wh)">'+(ls?ls.tonnen:0)+'</div><div style="font-family:var(--fd);font-size:9px;color:var(--mut);letter-spacing:.1em;margin-top:3px">TONNEN</div></div>';
      html += '</div>';
      html += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--bdr2)">';
      html += '<div style="padding:10px 8px;text-align:center;border-right:1px solid var(--bdr2)"><div style="font-family:var(--fd);font-size:20px;font-weight:900;color:var(--wh)">'+elapsed+'</div><div style="font-family:var(--fd);font-size:9px;color:var(--mut);letter-spacing:.1em;margin-top:2px">FAHRZEIT</div></div>';
      html += '<div style="padding:10px 8px;text-align:center;border-right:1px solid var(--bdr2)"><div style="font-family:var(--fd);font-size:20px;font-weight:900;color:var(--wh)">'+(ls?ls.maxSpeed:0)+'<span style="font-size:11px;color:var(--mut)">km/h</span></div><div style="font-family:var(--fd);font-size:9px;color:var(--mut);letter-spacing:.1em;margin-top:2px">V-MAX</div></div>';
      html += '<div style="padding:10px 8px;text-align:center"><div style="font-family:var(--fd);font-size:20px;font-weight:900;color:var(--wh)">'+(ls?ls.avgSpeed:0)+'<span style="font-size:11px;color:var(--mut)">km/h</span></div><div style="font-family:var(--fd);font-size:9px;color:var(--mut);letter-spacing:.1em;margin-top:2px">DURCHSCHNITT</div></div>';
      html += '</div>';
      html += '<div style="padding:12px 14px">'
        + '<button class="btn btn-red" type="button" onclick="SCKR.regatta.trimm.stopRace();SCKR.regatta.stats.render()" style="margin-bottom:0">&#9632; WETTFAHRT BEENDEN &amp; SPEICHERN</button>'
        + '</div>';
    }
    html += '</div>';

    // ── Gespeicherte Wettfahrten ─────────────────
    html += '<div class="pnl"><div class="phd"><span class="phd-t">Gespeicherte Wettfahrten ('+sessions.length+')</span></div>';

    if(sessions.length === 0) {
      html += '<div style="padding:24px;text-align:center;font-size:13px;color:var(--mut)">Noch keine Wettfahrten gespeichert.</div>';
    } else {
      for(var i=0;i<sessions.length;i++) {
        var s = sessions[i];
        var dur = SCKR.core.fmt.time(s.durationSec||0);
        html += '<div style="padding:14px 16px;border-bottom:1px solid var(--bdr2);cursor:pointer" onclick="SCKR.regatta.stats.showDetail('+i+')">'
          + '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">'
          + '<div style="font-family:var(--fd);font-size:16px;font-weight:800;color:var(--wh)">'+esc(s.date)+' &mdash; '+esc(s.time)+'</div>'
          + '<div style="font-family:var(--fd);font-size:13px;font-weight:700;color:var(--acc)">'+dur+'</div>'
          + '</div>'
          + '<div style="display:flex;gap:8px;flex-wrap:wrap">'
          + '<span style="font-family:var(--fd);font-size:11px;font-weight:700;padding:2px 8px;border-radius:3px;background:rgba(200,16,46,.1);color:var(--acc)">'+(s.wendCount||0)+' Wenden</span>'
          + '<span style="font-family:var(--fd);font-size:11px;font-weight:700;padding:2px 8px;border-radius:3px;background:rgba(45,127,212,.1);color:var(--teal)">'+(s.halseCount||0)+' Halsen</span>'
          + '<span style="font-family:var(--fd);font-size:11px;font-weight:700;padding:2px 8px;border-radius:3px;background:rgba(255,255,255,.06);color:var(--off)">'+(s.tonneCount||0)+' Tonnen</span>'
          + (s.maxSpeed ? '<span style="font-family:var(--fd);font-size:11px;font-weight:700;padding:2px 8px;border-radius:3px;background:rgba(255,255,255,.06);color:var(--off)">Vmax '+s.maxSpeed.toFixed(1)+' km/h</span>' : '')
          + '</div>'
          + '</div>';
      }
    }
    html += '</div>';

    html += '</div>';
    el.innerHTML = html;
  },

  showDetail: function(idx) {
    var sessions = SCKR.regatta.trimm.state.savedSessions;
    var s = sessions[idx];
    if(!s) return;
    var esc = SCKR.core.fmt.esc;
    var dur = SCKR.core.fmt.time(s.durationSec||0);

    var html = '<div class="sheet-hd"><h3>'+esc(s.date)+' &mdash; '+esc(s.time)+'</h3>'
      + '<button class="sheet-close" type="button" onclick="SCKR.core.ui.closeSheet()">SCHLIESSEN</button></div>';

    // Summary stats
    html += '<div class="pnl"><div class="phd"><span class="phd-t">Zusammenfassung</span></div>';
    html += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr">';
    var mkS = function(val, lbl, color) {
      return '<div style="padding:16px 8px;text-align:center;border-right:1px solid var(--bdr2)">'
        + '<div style="font-family:var(--fd);font-size:32px;font-weight:900;color:'+(color||'var(--wh)')+'">'+val+'</div>'
        + '<div style="font-family:var(--fd);font-size:9px;color:var(--mut);letter-spacing:.1em;margin-top:4px">'+lbl+'</div>'
        + '</div>';
    };
    html += mkS(s.wendCount||0, "WENDEN", "var(--acc)");
    html += mkS(s.halseCount||0, "HALSEN", "var(--teal)");
    html += mkS(s.tonneCount||0, "TONNEN", "");
    html += '</div>';
    html += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr">';
    html += mkS(dur, "FAHRZEIT", "");
    html += mkS((s.maxSpeed||0).toFixed(1), "V-MAX km/h", "var(--acc)");
    html += mkS((s.avgSpeed||0).toFixed(1), "Ø km/h", "");
    html += '</div>';
    if(s.windDir) {
      html += '<div style="padding:10px 14px;border-top:1px solid var(--bdr2);font-family:var(--fd);font-size:12px;color:var(--mut)">Wind: '+Math.round(s.windDir)+'° &mdash; '+SCKR.core.fmt.compass(s.windDir)+'</div>';
    }
    html += '</div>';

    // Trimm Log
    if(s.log && s.log.length > 0) {
      html += '<div class="pnl"><div class="phd"><span class="phd-t">Trimm-Log ('+s.log.length+' Events)</span></div>';
      var typeLabel = {wende:"Wende",halse:"Halse",schwert_hoch:"Schwert hoch",schwert_tief:"Schwert tief",achterstag_an:"Achterstag an",achterstag_los:"Achterstag los",traveller_luv:"Traveller Luv",traveller_lee:"Traveller Lee",gust:"Boe",manuell:"Manuell"};
      var typeColor = {wende:"var(--acc)",halse:"var(--teal)",gust:"#e67e22"};
      for(var j=0;j<s.log.length;j++) {
        var ev = s.log[j];
        var evTime = new Date(ev.t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
        var evLabel = typeLabel[ev.type] || ev.type;
        var evColor = typeColor[ev.type] || "var(--off)";
        html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid var(--bdr2)">'
          + '<div style="display:flex;align-items:center;gap:10px">'
          + '<div style="width:8px;height:8px;border-radius:50%;background:'+evColor+';flex-shrink:0"></div>'
          + '<div style="font-size:13px;color:var(--wh);font-weight:600">'+esc(evLabel)+'</div>'
          + (ev.value ? '<div style="font-size:11px;color:var(--mut)">'+esc(String(ev.value))+'</div>' : '')
          + '</div>'
          + '<div style="font-family:var(--fd);font-size:11px;color:var(--mut)">'+evTime+'</div>'
          + '</div>';
      }
      html += '</div>';
    }

    // Delete button
    html += '<div style="padding:0 14px 14px;display:flex;gap:8px">'
      + '<button class="btn btn-red" type="button" onclick="SCKR.regatta.stats.exportToFahrtenbuch('+idx+')" style="flex:2;margin:0">&#8646; INS FAHRTENBUCH</button>'
      + '<button class="btn" type="button" onclick="SCKR.regatta.stats.deleteSession('+idx+')" style="flex:1;margin:0;background:rgba(192,57,43,.2);color:#e74c3c;border:none">LOESCHEN</button>'
      + '</div>';

    SCKR.core.ui.openSheet(html);
  },

  deleteSession: function(idx) {
    if(!confirm("Wettfahrt loeschen?")) return;
    SCKR.regatta.trimm.state.savedSessions.splice(idx, 1);
    SCKR.core.storage.set("regatta_sessions", SCKR.regatta.trimm.state.savedSessions);
    SCKR.core.ui.closeSheet();
    SCKR.regatta.stats.render();
  },

  /* ── Export ins Fahrtenbuch ── */
  exportToFahrtenbuch: function(idx) {
    var sessions = SCKR.regatta.trimm.state.savedSessions;
    var s = sessions[idx];
    if(!s) return;

    // Baue Fahrtenbuch-kompatibles Trip-Objekt
    var trip = {
      id: "regatta_"+s.id,
      date: s.date,
      startTime: new Date(s.raceStart||s.id).toISOString(),
      endTime:   s.durationSec ? new Date((s.raceStart||s.id) + s.durationSec*1000).toISOString() : null,
      category: "Binnen",
      type: "Regatta",
      boat: "",
      description: "Regatta "+s.date+" "+s.time
        + " | "+s.wendCount+" Wenden, "+s.halseCount+" Halsen"
        + " | Vmax: "+(s.maxSpeed||0).toFixed(1)+" km/h",
      km: 0, // GPS nicht verfuegbar waehrend Regatta
      sailKm: 0, motorKm: 0,
      maxSpeed: s.maxSpeed || 0,
      avgSpeed: s.avgSpeed || 0,
      hasRegattaFn: true,
      regattaData: {
        wenden:  s.wendCount  || 0,
        halsen:  s.halseCount || 0,
        tonnen:  s.tonneCount || 0,
        boeen:   s.gustCount  || 0,
        dauer:   s.durationSec || 0,
        windDir: s.windDir || null,
        log:     s.log || []
      },
      trackPoints: [],
      infraEvents: [],
      points: 0,
      _source: "regatta"
    };

    // Als JSON zum Download/Teilen anbieten
    var json = JSON.stringify({version:2, trips:[trip]}, null, 2);
    var filename = "Regatta_"+s.date+"_Fahrtenbuch.json";
    var blob = new Blob([json], {type:"application/json"});
    var file = new File([blob], filename, {type:"application/json"});

    var esc = SCKR.core.fmt.esc;
    var html = '<div class="sheet-hd"><h3>INS FAHRTENBUCH</h3>'
      + '<button class="sheet-close" type="button" onclick="SCKR.core.ui.closeSheet()">X</button></div>'
      + '<div class="pnl"><div class="phd"><span class="phd-t">Wettfahrt uebertragen</span></div>'
      + '<div style="padding:14px;font-size:13px;color:var(--off);line-height:1.7">'
      + '<strong>'+esc(s.date)+' &mdash; '+esc(s.time)+'</strong><br>'
      + s.wendCount+' Wenden &middot; '+s.halseCount+' Halsen &middot; '+s.tonneCount+' Tonnen<br>'
      + 'Vmax: '+(s.maxSpeed||0).toFixed(1)+' km/h &middot; &Oslash; '+(s.avgSpeed||0).toFixed(1)+' km/h'
      + '</div>'
      + '<div style="padding:0 14px 14px;display:flex;flex-direction:column;gap:8px">'

      // Option A: Direkt ueber localStorage (wenn auf gleichem Geraet)
      + '<button type="button" class="btn btn-red" onclick="SCKR.regatta.stats._writeTripToStorage('+JSON.stringify(trip).replace(/</g,'&lt;').replace(/>/g,'&gt;')+')" style="text-align:left;padding:14px">'
      + '<div style="font-family:var(--fd);font-size:15px;font-weight:900">&#8646; DIREKT IMPORTIEREN</div>'
      + '<div style="font-size:11px;color:rgba(255,255,255,.7);margin-top:2px">In Fahrtenbuch-App (gleiches Geraet &amp; Browser)</div>'
      + '</button>'

      // Option B: Als JSON-Datei exportieren
      + '<button type="button" class="btn" style="background:var(--bg3);border:2px solid var(--bdr);color:var(--wh);text-align:left;padding:14px" onclick="SCKR.regatta.stats._exportSessionFile('+idx+')">'
      + '<div style="font-family:var(--fd);font-size:15px;font-weight:900">&#8681; ALS BACKUP HERUNTERLADEN</div>'
      + '<div style="font-size:11px;color:var(--mut);margin-top:2px">JSON importieren ins Fahrtenbuch</div>'
      + '</button>'

      // Option C: Teilen (iCloud)
      + '<button type="button" class="btn" style="background:var(--bg3);border:2px solid var(--bdr);color:var(--wh);text-align:left;padding:14px" onclick="SCKR.regatta.stats._shareSessionFile('+idx+')">'
      + '<div style="font-family:var(--fd);font-size:15px;font-weight:900">&#8679; TEILEN / iCLOUD</div>'
      + '<div style="font-size:11px;color:var(--mut);margin-top:2px">iCloud Drive, AirDrop, Mail...</div>'
      + '</button>'

      + '</div></div>';

    SCKR.regatta.stats._pendingTrip = {trip: trip, file: file, filename: filename, json: json};
    SCKR.core.ui.openSheet(html);
  },

  _doDirectImport: async function() {
    var p = SCKR.regatta.stats._pendingTrip;
    if(!p || !p.trip) { SCKR.core.ui.toast("Bitte Wettfahrt auswaehlen"); return; }
    await SCKR.regatta.stats._writeTripToStorage(p.trip);
  },

    _writeTripToStorage: async function(trip) {
    try {
      // Schreibe direkt in Fahrtenbuch-Storage (gleicher localStorage)
      var key = "trip:"+trip.id;
      await SCKR.core.storage.set(key, trip);
      SCKR.core.ui.closeSheet();
      SCKR.core.ui.toast("IMPORTIERT! Im Fahrtenbuch unter Fahrten sichtbar.");
    } catch(e) {
      SCKR.core.ui.toast("FEHLER: "+e.message);
    }
  },

  _exportSessionFile: function(idx) {
    var p = SCKR.regatta.stats._pendingTrip;
    if(!p) return;
    var blob = new Blob([p.json], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = p.filename; a.click();
    setTimeout(function(){URL.revokeObjectURL(url);}, 1000);
    SCKR.core.ui.toast("HERUNTERGELADEN");
  },

  _shareSessionFile: function(idx) {
    var p = SCKR.regatta.stats._pendingTrip;
    if(!p) return;
    if(navigator.share && navigator.canShare && navigator.canShare({files:[p.file]})) {
      navigator.share({files:[p.file], title:"Regatta Fahrtenbuch", text:p.filename})
        .then(function(){ SCKR.core.ui.toast("GETEILT"); })
        .catch(function(e){ if(e.name!=="AbortError") SCKR.regatta.stats._exportSessionFile(idx); });
    } else {
      SCKR.regatta.stats._exportSessionFile(idx);
    }
  }
};

})();
</script>

/* ═══════════════════════════════════════════════════
   TAB 1: START-TIMER (5-Min-Sequenz)
   ═══════════════════════════════════════════════════ */

SCKR.regatta.timer = {
  state: {
    running: false,
    startEpoch: null,    // Zeitpunkt des Startsignals (0:00)
    interval: null,
    selectedFlag: "P"    // Welche Vorbereitungs-Flagge wird verwendet
  },

  start: function() {
    var st = SCKR.regatta.timer.state;
    st.running = true;
    st.startEpoch = Date.now() + 300000;  // Jetzt + 5 Minuten = Startsignal
    SCKR.core.ui.toast("TIMER GESTARTET");
    SCKR.core.ui.beep(880, 0.3);
    SCKR.core.ui.vibrate(80);
    if(st.interval) clearInterval(st.interval);
    st.interval = setInterval(SCKR.regatta.timer.tick, 250);
    SCKR.regatta.timer.tick();
  },

  resync: function() {
    var st = SCKR.regatta.timer.state;
    if(!st.running) return;
    // Resync: setze Startzeitpunkt auf jetzt + Restzeit basierend auf naechstem ganzen Punkt
    var now = Date.now();
    var rem = (st.startEpoch - now) / 1000;
    var snap;
    if(rem > 270) snap = 300;       // Re-sync auf 5:00
    else if(rem > 210) snap = 240;  // 4:00
    else if(rem > 30)  snap = 60;   // 1:00
    else snap = 0;
    st.startEpoch = now + (snap*1000);
    SCKR.core.ui.toast("RESYNC AUF " + SCKR.core.fmt.mmss(snap));
    SCKR.core.ui.vibrate(40);
    SCKR.regatta.timer.tick();
  },

  stop: function() {
    var st = SCKR.regatta.timer.state;
    st.running = false;
    if(st.interval) { clearInterval(st.interval); st.interval = null; }
    st.startEpoch = null;
    SCKR.core.ui.toast("TIMER GESTOPPT");
    SCKR.regatta.timer.render();
  },

  tick: function() {
    var st = SCKR.regatta.timer.state;
    if(!st.running || !st.startEpoch) return;
    var now = Date.now();
    var rem = Math.round((st.startEpoch - now)/1000);

    // Akustische Signalpunkte
    if(!st.lastSignal) st.lastSignal = {};
    if(rem === 240 && !st.lastSignal[240]) { st.lastSignal[240] = true; SCKR.core.ui.beep(880, 0.3); SCKR.core.ui.vibrate(150); SCKR.core.ui.toast("4 MIN - VORBEREITUNGSSIGNAL"); }
    if(rem === 60  && !st.lastSignal[60])  { st.lastSignal[60]  = true; SCKR.core.ui.beep(880, 0.6); SCKR.core.ui.vibrate(200); SCKR.core.ui.toast("1 MIN - LETZTE MINUTE"); }
    if(rem === 0   && !st.lastSignal[0])   { st.lastSignal[0]   = true; SCKR.core.ui.beep(1200, 0.8); SCKR.core.ui.vibrate([200,100,200,100,200]); SCKR.core.ui.toast("START!"); }

    if(rem < -10) {
      // 10 Sekunden nach Start: Timer stoppen
      SCKR.regatta.timer.stop();
      return;
    }

    SCKR.regatta.timer.render(rem);
  },

  render: function(rem) {
    var st = SCKR.regatta.timer.state;
    var el = document.getElementById("timer");
    if(!el) return;

    if(!st.running) {
      st.lastSignal = {};
      var prepFlag = SCKR.regatta.flags.byCode(st.selectedFlag);
      el.innerHTML =
        '<div class="shead"><div><div class="lxs">5-Minuten-Sequenz</div><h2>Start-Timer</h2></div></div>'
        + '<div class="timer-hero">'
        + '<div class="timer-status">BEREIT ZUM START</div>'
        + '<div class="timer-mmss">5:00</div>'
        + '<div class="timer-flag-name">Vorbereitungsflagge: ' + (prepFlag ? prepFlag.name : '-') + '</div>'
        + '<div class="flag-disp"><svg class="flag-svg" viewBox="0 0 60 42">' + (prepFlag ? prepFlag.svg : '') + '</svg>'
        + '<div class="flag-info"><div class="flag-letter">' + (prepFlag ? prepFlag.code : '?') + '</div><div class="flag-meaning">'+ (prepFlag ? prepFlag.rule : '') +'</div></div></div>'
        + '</div>'
        + '<div class="pnl"><div class="phd"><span class="phd-t">Vorbereitungs-Flagge waehlen</span></div>'
        + '<div class="flag-grid">'
        +   ['P','I','Z','U','BLK'].map(function(c){
              var f = SCKR.regatta.flags.byCode(c);
              if(!f) return '';
              return '<div class="flag-card'+(c===st.selectedFlag?' sel':'')+'" onclick="SCKR.regatta.timer.selectFlag(\''+c+'\')" style="'+(c===st.selectedFlag?'border-color:var(--acc);background:rgba(200,16,46,.1)':'')+'">'
                + '<svg class="flag-svg" viewBox="0 0 60 42">'+f.svg+'</svg>'
                + '<div class="flag-card-info"><div class="flag-card-letter">'+f.code+'</div><div class="flag-card-name">'+f.name.split(' - ')[0]+'</div></div>'
                + '</div>';
            }).join('')
        + '</div></div>'
        + '<button class="btn btn-green" type="button" onclick="SCKR.regatta.timer.start()">5-MIN START SEQUENZ</button>';
      return;
    }

    if(rem===undefined) rem = Math.round((st.startEpoch - Date.now())/1000);
    var phase, klass="";
    if(rem > 240)      phase = "ANKUENDIGUNGSSIGNAL (5 Min)";
    else if(rem > 60)  phase = "VORBEREITUNGSSIGNAL (4 Min)";
    else if(rem > 0)   { phase = "LETZTE MINUTE"; klass="warn"; }
    else if(rem === 0) { phase = "START!"; klass="danger"; }
    else               { phase = "GESTARTET (vor "+Math.abs(rem)+"s)"; klass="danger"; }

    var prepFlag = SCKR.regatta.flags.byCode(st.selectedFlag);
    var classFlag = SCKR.regatta.flags.byCode("AP"); // Symbol fuer Klassen-Flagge
    var displayFlag;
    if(rem > 240)      displayFlag = prepFlag;  // Klasseflagge (vereinfacht: Prep-Flagge zeigen)
    else if(rem > 60)  displayFlag = prepFlag;
    else if(rem > 0)   displayFlag = prepFlag;  // Letzte Min: nur Klasseflagge - hier vereinfacht
    else               displayFlag = null;

    el.innerHTML =
      '<div class="shead"><div><div class="lxs">'+phase+'</div><h2>Start-Timer</h2></div></div>'
      + '<div class="timer-hero">'
      + '<div class="timer-status">'+phase+'</div>'
      + '<div class="timer-mmss '+klass+'">'+SCKR.core.fmt.mmss(Math.max(0,rem))+'</div>'
      + (displayFlag ? '<div class="timer-flag-name">'+displayFlag.name+'</div>'
        + '<div class="flag-disp"><svg class="flag-svg" viewBox="0 0 60 42">'+displayFlag.svg+'</svg>'
        + '<div class="flag-info"><div class="flag-letter">'+displayFlag.code+'</div><div class="flag-meaning">'+displayFlag.rule+'</div></div></div>'
        : '<div class="timer-flag-name">Klassenflagge eingeholt - Start!</div>')
      + '</div>'
      + '<div class="timer-controls">'
      +   '<button class="btn btn-gold" type="button" onclick="SCKR.regatta.timer.resync()">RE-SYNC</button>'
      +   '<button class="btn btn-red" type="button" onclick="SCKR.regatta.timer.stop()">STOPP</button>'
      + '</div>'
      + '<div class="pnl"><div class="phd"><span class="phd-t">Naechste Signale</span></div>'
      + '<div style="padding:12px 14px;font-size:13px;line-height:1.7;color:var(--off)">'
      +   '<div style="display:flex;justify-content:space-between;padding:4px 0">5:00 - Klassenflagge (Ankuendigung)<span style="color:'+(rem>=240?'var(--mut)':'var(--green)')+'">'+(rem>=240?'kommt':'ok')+'</span></div>'
      +   '<div style="display:flex;justify-content:space-between;padding:4px 0">4:00 - '+(prepFlag?prepFlag.name:'Vorbereitung')+'<span style="color:'+(rem>=60?'var(--mut)':rem>=240?'var(--orange)':'var(--green)')+'">'+(rem>=240?'kommt':rem>=60?'aktiv':'ok')+'</span></div>'
      +   '<div style="display:flex;justify-content:space-between;padding:4px 0">1:00 - Vorbereitungsflagge eingeholt<span style="color:'+(rem>=60?'var(--mut)':rem>0?'var(--orange)':'var(--green)')+'">'+(rem>=60?'kommt':rem>0?'aktiv':'ok')+'</span></div>'
      +   '<div style="display:flex;justify-content:space-between;padding:4px 0">0:00 - Klassenflagge eingeholt - START<span style="color:'+(rem>0?'var(--mut)':'var(--red)')+'">'+(rem>0?'kommt':'JETZT')+'</span></div>'
      + '</div></div>';
  },

  selectFlag: function(code) {
    SCKR.regatta.timer.state.selectedFlag = code;
    SCKR.regatta.timer.render();
  }
};

SCKR.regatta.chart = {
  state: {
    course: {
      id: null,
      name: "Aktueller Kurs",
      buoys: [],          // { id, type, name, lat, lng, rounding, order }
      startLine: { stb:null, pin:null },  // {lat,lng}
      windDir: null,      // Grad, manuell oder vom Wetter
      currentBuoyIdx: 0,
      created: null
    },
    map: null,
    buoyMarkers: {},
    startStbMarker: null,
    startPinMarker: null,
    startLine: null,
    routeLine: null,
    addMode: null,        // null | "buoy" | "startStb" | "startPin"
    photoOverlay: null,
    photoBounds: null
  },

  /* === BUOY TYPES === */
  buoyTypes: {
    luv:    { label:"Luv",    color:"#C0392B", desc:"Luv-Tonne (oben am Kurs)" },
    lee:    { label:"Lee",    color:"#1AABA0", desc:"Lee-Tonne (unten am Kurs)" },
    raum:   { label:"Raum",   color:"#E2C46A", desc:"Raumschots-Tonne (Dreieck)" },
    offset: { label:"Offset", color:"#9B59B6", desc:"Offset-Tonne neben Luv" },
    start:  { label:"Start",  color:"#27AE60", desc:"Startschiff" },
    pin:    { label:"Pin",    color:"#F39C12", desc:"Pin-Ende der Startlinie" },
    ziel:   { label:"Ziel",   color:"#3498DB", desc:"Ziel-Tonne" }
  },

  /* === LOAD/SAVE COURSE === */
  loadCourse: async function() {
    var c = await SCKR.core.storage.get("regatta_course");
    if(c) SCKR.regatta.chart.state.course = c;
    return SCKR.regatta.chart.state.course;
  },

  saveCourse: async function() {
    var c = SCKR.regatta.chart.state.course;
    if(!c.created) c.created = new Date().toISOString();
    if(!c.id) c.id = SCKR.core.util.uuid();
    await SCKR.core.storage.set("regatta_course", c);
  },

  /* === INFER BUOY TYPE FROM WIND === */
  inferBuoyType: function(lat, lng) {
    var c = SCKR.regatta.chart.state.course;
    if(!c.windDir || c.buoys.length===0) return "luv";  // First = Luv
    // Compare position relative to existing buoys
    // Simple heuristic: distance from existing Luv vs Lee
    var existing = {};
    for(var i=0;i<c.buoys.length;i++) {
      if(!existing[c.buoys[i].type]) existing[c.buoys[i].type] = c.buoys[i];
    }
    if(!existing.luv) return "luv";
    if(!existing.lee) return "lee";
    return "raum";
  },

  /* === ADD BUOY === */
  addBuoy: async function(lat, lng) {
    var c = SCKR.regatta.chart.state.course;
    var type = SCKR.regatta.chart.inferBuoyType(lat, lng);
    var buoy = {
      id: SCKR.core.util.uuid(),
      type: type,
      name: SCKR.regatta.chart.buoyTypes[type].label + " " + (c.buoys.filter(function(b){return b.type===type;}).length + 1),
      lat: lat, lng: lng,
      rounding: "S",   // S=Steuerbord (Standard), R=Backbord
      order: c.buoys.length
    };
    c.buoys.push(buoy);
    await SCKR.regatta.chart.saveCourse();
    SCKR.regatta.chart.renderMap();
    SCKR.core.ui.toast("TONNE GESETZT: " + buoy.name);
    SCKR.core.ui.vibrate(40);
  },

  /* === SET START LINE END === */
  setStartEnd: async function(end, lat, lng) {
    var c = SCKR.regatta.chart.state.course;
    if(end === "stb") c.startLine.stb = {lat:lat, lng:lng};
    else if(end === "pin") c.startLine.pin = {lat:lat, lng:lng};
    await SCKR.regatta.chart.saveCourse();
    SCKR.regatta.chart.renderMap();
    SCKR.core.ui.toast(end==="stb" ? "STARTSCHIFF GESETZT" : "PIN GESETZT");
    SCKR.core.ui.vibrate(40);
  },

  /* === USE CURRENT GPS POSITION === */
  setStartFromGPS: async function(end) {
    if(!SCKR.core.gps.currentPos) {
      SCKR.core.ui.toast("KEIN GPS - GPS ZUERST AKTIVIEREN");
      return;
    }
    var p = SCKR.core.gps.currentPos;
    await SCKR.regatta.chart.setStartEnd(end, p.lat, p.lng);
  },

  addBuoyFromGPS: async function() {
    if(!SCKR.core.gps.currentPos) {
      SCKR.core.ui.toast("KEIN GPS - GPS ZUERST AKTIVIEREN");
      return;
    }
    var p = SCKR.core.gps.currentPos;
    await SCKR.regatta.chart.addBuoy(p.lat, p.lng);
  },

  /* === DELETE BUOY === */
  deleteBuoy: async function(id) {
    var c = SCKR.regatta.chart.state.course;
    c.buoys = c.buoys.filter(function(b){ return b.id !== id; });
    await SCKR.regatta.chart.saveCourse();
    SCKR.regatta.chart.renderMap();
    SCKR.core.ui.closeSheet();
    SCKR.core.ui.toast("TONNE GELOESCHT");
  },

  /* === UPDATE BUOY (type, name, rounding) === */
  updateBuoy: async function(id, fields) {
    var c = SCKR.regatta.chart.state.course;
    for(var i=0;i<c.buoys.length;i++) {
      if(c.buoys[i].id===id) {
        for(var k in fields) c.buoys[i][k] = fields[k];
        break;
      }
    }
    await SCKR.regatta.chart.saveCourse();
    SCKR.regatta.chart.renderMap();
  },

  /* === EDIT BUOY SHEET === */
  editBuoy: function(id) {
    var c = SCKR.regatta.chart.state.course;
    var b = null, buoyIdx = -1;
    for(var i=0;i<c.buoys.length;i++) if(c.buoys[i].id===id) { b = c.buoys[i]; buoyIdx = i; break; }
    if(!b) return;

    var typeOpts = "";
    for(var t in SCKR.regatta.chart.buoyTypes) {
      var bt = SCKR.regatta.chart.buoyTypes[t];
      typeOpts += '<option value="'+t+'"'+(t===b.type?' selected':'')+'>'+bt.label+'</option>';
    }

    var html = '<div class="sheet-hd"><h3>'+SCKR.core.fmt.esc(b.name)+'</h3><button class="sheet-close" type="button" onclick="SCKR.core.ui.closeSheet()">SCHLIESSEN</button></div>'
      + '<div class="pnl">'
      + '<div class="fld"><label class="lbl">Name</label><input class="inp" id="bu-name" value="'+SCKR.core.fmt.esc(b.name)+'"></div>'
      + '<div class="fld"><label class="lbl">Tonnen-Typ</label><select class="inp" id="bu-type">'+typeOpts+'</select></div>'
      + '<div class="fld"><label class="lbl">Rundungsrichtung</label>'
      +   '<div style="display:flex;gap:8px;margin-top:6px">'

  setRound: function(id, r) {
    SCKR.regatta.chart.updateBuoy(id, {rounding: r});
    SCKR.regatta.chart.editBuoy(id);
  },

  saveBuoy: async function(id) {
    var name = (document.getElementById("bu-name")||{}).value;
    var type = (document.getElementById("bu-type")||{}).value;
    await SCKR.regatta.chart.updateBuoy(id, {name:name, type:type});
    SCKR.core.ui.closeSheet();
    SCKR.core.ui.toast("AKTUALISIERT");
  },

  /* === POSITION: GPS JETZT === */
  setBuoyToGPS: async function(id) {
    if(!SCKR.core.gps.currentPos) { SCKR.core.ui.toast("KEIN GPS - GPS ZUERST AKTIVIEREN"); return; }
    var p = SCKR.core.gps.currentPos;
    await SCKR.regatta.chart.updateBuoy(id, {lat:p.lat, lng:p.lng});
    SCKR.core.ui.toast("POSITION = AKTUELLES GPS");
    SCKR.regatta.chart.editBuoy(id);
  },

  /* === POSITION: MANUELL (Lat/Lng) === */
  setBuoyManual: async function(id) {
    var latEl = document.getElementById("bu-lat");
    var lngEl = document.getElementById("bu-lng");
    if(!latEl || !lngEl) return;
    var lat = parseFloat(latEl.value), lng = parseFloat(lngEl.value);
    if(isNaN(lat) || isNaN(lng) || lat < -90 || lat > 90 || lng < -180 || lng > 180) {
      SCKR.core.ui.toast("UNGUELTIGE KOORDINATEN"); return;
    }
    await SCKR.regatta.chart.updateBuoy(id, {lat:lat, lng:lng});
    SCKR.core.ui.toast("POSITION UEBERNOMMEN");
    SCKR.regatta.chart.editBuoy(id);
  },

  /* === POSITION: AUF KARTE NEU SETZEN === */
  repositionOnMap: function(id) {
    var s = SCKR.regatta.chart.state;
    s.addMode = "reposition:" + id;
    SCKR.core.ui.closeSheet();
    SCKR.core.ui.toast("TIPPE AUF KARTE FUER NEUE POSITION");
    if(s.map) s.map.getContainer().style.cursor = "crosshair";
  },

  /* === REIHENFOLGE AENDERN === */
  moveBuoyOrder: async function(id, dir) {
    var c = SCKR.regatta.chart.state.course;
    var idx = -1;
    for(var i=0;i<c.buoys.length;i++) if(c.buoys[i].id===id){idx=i;break;}
    if(idx === -1) return;
    var ni = idx + dir;
    if(ni < 0 || ni >= c.buoys.length) return;
    var tmp = c.buoys[idx]; c.buoys[idx] = c.buoys[ni]; c.buoys[ni] = tmp;
    for(var j=0;j<c.buoys.length;j++) c.buoys[j].order = j;
    await SCKR.regatta.chart.saveCourse();
    SCKR.regatta.chart.renderMap();
    SCKR.regatta.chart.editBuoy(id);
  },

  /* === MAP RENDERING === */
  renderMap: function() {
    var s = SCKR.regatta.chart.state;
    if(!s.map) return;

    // Clear existing buoy markers
    for(var id in s.buoyMarkers) {
      try { s.map.removeLayer(s.buoyMarkers[id]); } catch(e) {}
    }
    s.buoyMarkers = {};
    if(s.routeLine) { try { s.map.removeLayer(s.routeLine); } catch(e) {} s.routeLine = null; }
    if(s.startLine) { try { s.map.removeLayer(s.startLine); } catch(e) {} s.startLine = null; }
    if(s.startStbMarker) { try { s.map.removeLayer(s.startStbMarker); } catch(e) {} s.startStbMarker = null; }
    if(s.startPinMarker) { try { s.map.removeLayer(s.startPinMarker); } catch(e) {} s.startPinMarker = null; }

    var c = s.course;

    // Buoys
    for(var i=0;i<c.buoys.length;i++) {
      var b = c.buoys[i];
      var type = SCKR.regatta.chart.buoyTypes[b.type] || SCKR.regatta.chart.buoyTypes.luv;
      var isCurrent = (i === c.currentBuoyIdx);
      var sz = isCurrent ? 28 : 20;
      var buoyIcon = L.divIcon({
        className: '',
        html: '<div style="width:'+sz+'px;height:'+sz+'px;background:'+type.color+';border-radius:50%;border:'+(isCurrent?'3px solid #fff':'2px solid #03101e')+';cursor:grab;display:flex;align-items:center;justify-content:center;font-family:Barlow Condensed;font-size:9px;font-weight:800;color:#fff;'+(isCurrent?'box-shadow:0 0 14px '+type.color:'')+'">'+(i+1)+'</div>',
        iconSize:[sz,sz], iconAnchor:[sz/2,sz/2]
      });
      var marker = L.marker([b.lat, b.lng], {icon:buoyIcon, draggable:true});
      marker.bindPopup('<b>'+SCKR.core.fmt.esc(b.name)+'</b><br>'+type.label+' / '+b.rounding);
      marker.on("click", (function(bid){ return function(){ SCKR.regatta.chart.editBuoy(bid); }; })(b.id));
      marker.on("dragend", (function(bid){ return function(e) {
        var ll = e.target.getLatLng();
        SCKR.regatta.chart.updateBuoy(bid, {lat:ll.lat, lng:ll.lng});
        SCKR.core.ui.toast("TONNE VERSCHOBEN");
      }; })(b.id));
      marker.addTo(s.map);
      s.buoyMarkers[b.id] = marker;

      // Order number badge
      var label = L.divIcon({
        className: 'buoy-label',
        html: '<div style="background:'+type.color+';color:#fff;font-family:Barlow Condensed;font-weight:800;font-size:11px;padding:2px 6px;border-radius:8px;border:1px solid #03101e;white-space:nowrap;transform:translate(12px,-22px);box-shadow:0 2px 4px rgba(0,0,0,.5)">'+(i+1)+' '+type.label.charAt(0)+' / '+b.rounding+'</div>',
        iconSize: [60, 16],
        iconAnchor: [0, 0]
      });
      var labelMarker = L.marker([b.lat, b.lng], {icon: label, interactive: false}).addTo(s.map);
      s.buoyMarkers[b.id+"_lbl"] = labelMarker;
    }

    // Route line through buoys
    if(c.buoys.length >= 2) {
      var coords = c.buoys.map(function(b){ return [b.lat, b.lng]; });
      s.routeLine = L.polyline(coords, {
        color: "#C8A84B", weight: 2, opacity: 0.6, dashArray: "6,8"
      }).addTo(s.map);
    }

    // Start line
    if(c.startLine.stb) {
      s.startStbMarker = L.circleMarker([c.startLine.stb.lat, c.startLine.stb.lng], {
        radius: 9, color: "#fff", fillColor: "#27AE60", fillOpacity: 1, weight: 2
      }).bindPopup("Startschiff (Stb)").addTo(s.map);
    }
    if(c.startLine.pin) {
      s.startPinMarker = L.circleMarker([c.startLine.pin.lat, c.startLine.pin.lng], {
        radius: 9, color: "#fff", fillColor: "#F39C12", fillOpacity: 1, weight: 2
      }).bindPopup("Pin-Ende (Bb)").addTo(s.map);
    }
    if(c.startLine.stb && c.startLine.pin) {
      s.startLine = L.polyline([
        [c.startLine.stb.lat, c.startLine.stb.lng],
        [c.startLine.pin.lat, c.startLine.pin.lng]
      ], {color: "#27AE60", weight: 4, opacity: 0.8}).addTo(s.map);
    }

    // Update current buoy info display
    SCKR.regatta.chart.updateInfo();
  },

  /* === LIVE INFO (next buoy distance + bearing) === */
  updateInfo: function() {
    var c = SCKR.regatta.chart.state.course;
    var pos = SCKR.core.gps.currentPos;
    var infoEl = document.getElementById("chart-nav-info");
    if(!infoEl) return;
    if(!pos) {
      infoEl.innerHTML = '<div style="text-align:center;color:var(--mut);font-size:12px;padding:14px">GPS nicht aktiv - tippe oben rechts auf den GPS-Button</div>';
      return;
    }
    if(c.buoys.length === 0) {
      infoEl.innerHTML = '<div style="text-align:center;color:var(--mut);font-size:12px;padding:14px">Noch keine Tonnen gesetzt</div>';
      return;
    }
    var current = c.buoys[c.currentBuoyIdx] || c.buoys[0];
    var dist = SCKR.core.util.haversine(pos, {lat:current.lat,lng:current.lng}) * 1000;
    var brng = SCKR.core.util.bearing(pos, {lat:current.lat,lng:current.lng});
    var typeColor = (SCKR.regatta.chart.buoyTypes[current.type]||{}).color || "#C8A84B";

    // Auto-advance if very close
    if(dist < 20 && c.currentBuoyIdx < c.buoys.length - 1) {
      c.currentBuoyIdx++;
      SCKR.core.ui.toast("PASSAGE - NAECHSTE: " + c.buoys[c.currentBuoyIdx].name);
      SCKR.core.ui.vibrate([100,50,100]);
      SCKR.core.ui.beep(660, 0.4);
      SCKR.regatta.chart.saveCourse();
      SCKR.regatta.chart.renderMap();
      return;
    }

    var arrow = '<svg width="22" height="22" viewBox="0 0 24 24" style="vertical-align:middle"><g transform="rotate('+(brng-SCKR.core.gps.currentHeading)+' 12 12)"><path d="M12 3 L18 18 L12 14 L6 18 Z" fill="'+typeColor+'" stroke="#fff" stroke-width="1"/></g></svg>';

    infoEl.innerHTML = '<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;gap:10px">'
      + '<div style="flex:1;min-width:0">'
      +   '<div style="font-family:var(--fd);font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--mut)">NAECHSTE TONNE</div>'
      +   '<div style="font-family:var(--fd);font-size:18px;font-weight:800;color:'+typeColor+';white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+SCKR.core.fmt.esc(current.name)+' / '+current.rounding+'</div>'
      + '</div>'
      + '<div style="text-align:right">'
      +   '<div style="font-family:var(--fd);font-size:24px;font-weight:900;color:var(--wh);font-variant-numeric:tabular-nums;line-height:1">'+Math.round(dist)+'<span style="font-size:12px;color:var(--acc3);margin-left:2px">m</span></div>'
      +   '<div style="margin-top:2px">'+arrow+' <span style="font-family:var(--fd);font-size:11px;color:var(--mut)">'+Math.round(brng)+'&#176;</span></div>'
      + '</div></div>';
  },

  /* === ADVANCE BUOY MANUALLY === */
  nextBuoy: function() {
    var c = SCKR.regatta.chart.state.course;
    if(c.currentBuoyIdx < c.buoys.length - 1) {
      c.currentBuoyIdx++;
      SCKR.regatta.chart.saveCourse();
      SCKR.regatta.chart.renderMap();
      SCKR.core.ui.toast("WEITER ZU: " + c.buoys[c.currentBuoyIdx].name);
    if(SCKR.regatta.trimm.state.raceActive) SCKR.regatta.trimm.state.tonneCount++;
    }
  },
  prevBuoy: function() {
    var c = SCKR.regatta.chart.state.course;
    if(c.currentBuoyIdx > 0) {
      c.currentBuoyIdx--;
      SCKR.regatta.chart.saveCourse();
      SCKR.regatta.chart.renderMap();
    }
  },

  /* === CLEAR COURSE === */
  clearCourse: async function() {
    if(!confirm("Alle Tonnen und Startlinie loeschen?")) return;
    SCKR.regatta.chart.state.course = {
      id: null, name:"Aktueller Kurs", buoys:[],
      startLine:{stb:null,pin:null}, windDir:null, currentBuoyIdx:0, created:null
    };
    await SCKR.regatta.chart.saveCourse();
    SCKR.regatta.chart.renderMap();
    SCKR.core.ui.toast("KURS GELOESCHT");
  },

  saveNamedCourse: async function() {
    var c = SCKR.regatta.chart.state.course;
    var name = prompt("Kurs-Name:", c.name || "Kurs 1");
    if(!name) return;
    c.name = name; c.id = c.id || SCKR.core.util.uuid();
    await SCKR.core.storage.set("course:"+c.id, c);
    var ex = await SCKR.core.storage.get("course_index") || [];
    if(ex.indexOf(c.id)===-1) ex.push(c.id);
    await SCKR.core.storage.set("course_index", ex);
    await SCKR.regatta.chart.saveCourse();
    SCKR.core.ui.toast("GESPEICHERT: "+name);
  },

  loadCoursesSheet: async function() {
    var ex = await SCKR.core.storage.get("course_index") || [];
    var list = [];
    for(var i=0;i<ex.length;i++){var c=await SCKR.core.storage.get("course:"+ex[i]);if(c)list.push(c);}
    if(!list.length){SCKR.core.ui.toast("KEINE KURSE GESPEICHERT");return;}
    SCKR.regatta.chart._cl = list;
    var esc=SCKR.core.fmt.esc;
    var h='<div class="sheet-hd"><h3>KURSE</h3><button class="sheet-close" type="button" onclick="SCKR.core.ui.closeSheet()">X</button></div>';
    for(var j=0;j<list.length;j++){
      h+='<div class="prow"><div><div style="font-weight:600">'+esc(list[j].name||"-")+'</div>'
        +'<div style="font-size:11px;color:var(--mut)">'+(list[j].buoys?list[j].buoys.length:0)+' Tonnen</div></div>'
        +'<div style="display:flex;gap:6px">'
        +'<button class="btn-sm" type="button" onclick="SCKR.regatta.chart.loadNamedCourse(SCKR.regatta.chart._cl['+j+'].id)" style="padding:6px 12px">LADEN</button>'
        +'<button type="button" onclick="SCKR.regatta.chart.deleteNamedCourse(SCKR.regatta.chart._cl['+j+'].id)" style="padding:5px 8px;border-radius:4px;border:none;background:rgba(192,57,43,.2);color:#e74c3c;font-size:11px;cursor:pointer">X</button>'
        +'</div></div>';
    }
    SCKR.core.ui.openSheet(h);
  },

  loadNamedCourse: async function(id) {
    var c=await SCKR.core.storage.get("course:"+id);if(!c)return;
    SCKR.regatta.chart.state.course=c;
    await SCKR.regatta.chart.saveCourse();
    SCKR.core.ui.closeSheet();
    SCKR.regatta.chart.render();
    SCKR.core.ui.toast("GELADEN: "+c.name);
  },

  deleteNamedCourse: async function(id) {
    if(!confirm("Kurs loeschen?"))return;
    await SCKR.core.storage.del("course:"+id);
    var ex=await SCKR.core.storage.get("course_index")||[];
    await SCKR.core.storage.set("course_index",ex.filter(function(x){return x!==id;}));
    SCKR.regatta.chart.loadCoursesSheet();
  },

  toggleAddMode: function() {

    if(!container) return;

    if(s.map) {

    }

    var center = SCKR.core.gps.currentPos
      ? [SCKR.core.gps.currentPos.lat, SCKR.core.gps.currentPos.lng]
      : [52.3218, 13.6538];
    var zoom = 16;

    if(s.course.buoys.length > 0) {
      var lats = s.course.buoys.map(function(b){return b.lat;});
      var lngs = s.course.buoys.map(function(b){return b.lng;});
      center = [(Math.min.apply(null,lats)+Math.max.apply(null,lats))/2, (Math.min.apply(null,lngs)+Math.max.apply(null,lngs))/2];
    }

    s.map = L.map(container, {zoomControl:true, attributionControl:false, tap:true}).setView(center, zoom);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {opacity:0.9, maxZoom:19}).addTo(s.map);

    // Tap to add buoy if mode active
    s.map.on("click", function(e) {
      if(s.addMode === "buoy") {
        SCKR.regatta.chart.addBuoy(e.latlng.lat, e.latlng.lng);
        SCKR.regatta.chart.toggleAddMode();
      } else if(s.addMode && s.addMode.indexOf("reposition:") === 0) {
        var bid = s.addMode.slice(11);
        SCKR.regatta.chart.updateBuoy(bid, {lat:e.latlng.lat, lng:e.latlng.lng});
        s.addMode = null;
        if(s.map) s.map.getContainer().style.cursor = "";
        SCKR.core.ui.toast("TONNE NEU PLATZIERT");
      }
    });

    // Position marker
    if(SCKR.core.gps.currentPos) {
      L.circleMarker([SCKR.core.gps.currentPos.lat, SCKR.core.gps.currentPos.lng], {
        radius:8, color:"#fff", fillColor:"#1AABA0", fillOpacity:1, weight:2
      }).bindPopup("Mein Standort").addTo(s.map);
    }

    SCKR.regatta.chart.renderMap();

    if(s.course.buoys.length >= 2) {
      var coords = s.course.buoys.map(function(b){return [b.lat,b.lng];});
      s.map.fitBounds(coords, {padding:[40,40]});
    }

    setTimeout(function(){ if(s.map) s.map.invalidateSize(true); }, 300);
    setTimeout(function(){ if(s.map) s.map.invalidateSize(true); }, 800);
  }
};

// Erweitere core.util um Glaettungs-Funktionen
if(SCKR && SCKR.core && SCKR.core.util) {

  // EMA-Glättung für Winkel (kompass-korrekt über 0/360 Grenze)
  SCKR.core.util.emaHeading = function(prev, current, alpha) {
    if(prev === null || prev === undefined || isNaN(prev)) return current;
    if(current === null || current === undefined || isNaN(current)) return prev;
    alpha = alpha || 0.2;
    var diff = ((current - prev + 540) % 360) - 180;
    return (prev + alpha * diff + 360) % 360;
  };

  // Gleitender Mittelwert für Speed (3 Sekunden = trim-tauglich)
  SCKR.core.util.smoothValue = function(samples, newValue, maxAge_ms) {
    var now = Date.now();
    samples = samples || [];
    samples.push({v: newValue, t: now});
    var cutoff = now - (maxAge_ms || 3000);
    while(samples.length > 0 && samples[0].t < cutoff) samples.shift();
    if(samples.length === 0) return {avg: newValue, samples: samples};
    var sum = samples.reduce(function(s,x){return s+x.v;}, 0);
    return {avg: sum/samples.length, samples: samples};
  };
}

// Magnetsensor-Modul
SCKR.regatta._magnetic = {
  heading: null,
  granted: false,
  pendingPermission: null,

  init: function() {
    var self = this;
    if(!window.DeviceOrientationEvent) return;

    var handle = function(e) {
      if(e.webkitCompassHeading !== undefined && e.webkitCompassHeading !== null) {
        self.heading = e.webkitCompassHeading;
        self.granted = true;
      } else if(e.alpha !== null && e.alpha !== undefined && e.absolute) {
        self.heading = (360 - e.alpha) % 360;
        self.granted = true;
      }
    };

    if(typeof DeviceOrientationEvent.requestPermission === "function") {
      self.pendingPermission = function() {
        DeviceOrientationEvent.requestPermission().then(function(state) {
          if(state === "granted") {
            window.addEventListener("deviceorientation", handle, true);
          }
        }).catch(function(){});
      };
    } else {
      window.addEventListener("deviceorientation", handle, true);
    }
  },

  requestPermission: function() {
    if(this.pendingPermission) {
      this.pendingPermission();
      this.pendingPermission = null;
    }
  }
};

// Smoothing-State für Regatta
SCKR.regatta._smooth = {

  smoothedSpeed: 0,
  smoothedHeading: 0

// Wir wickeln den GPS-Polling um, damit Werte geglättet werden
(function() {
  if(!SCKR.core.gps) return;
  var lastPos = null;
  var smoothInterval = setInterval(function() {
    if(!SCKR.core.gps.granted) return;
    var rawSpd = SCKR.core.gps.rawSpeed !== undefined ? SCKR.core.gps.rawSpeed : SCKR.core.gps.currentSpeed;
    var pos = SCKR.core.gps.currentPos;
    if(rawSpd === undefined || rawSpd === null) return;

    // Speed-Glättung
    var smR = SCKR.core.util.smoothValue(SCKR.regatta._smooth.speedSamples, rawSpd, 3000);
    SCKR.regatta._smooth.speedSamples = smR.samples;
    SCKR.regatta._smooth.smoothedSpeed = smR.avg;

    // Heading-Bestimmung: Hybrid
    var newHeading = null;
    if(smR.avg > 0.28) {
      // Schnell genug: GPS-Heading (sofern verfügbar)
      newHeading = SCKR.core.gps.currentHeading;
    } else if(SCKR.regatta._magnetic.heading !== null) {
      // Langsam/Still: Magnetsensor
      newHeading = SCKR.regatta._magnetic.heading;
    }

    if(newHeading !== null && !isNaN(newHeading)) {
      // Dead-zone: Änderungen unter 2° ignorieren (kein Rauschen)
      var prev = SCKR.regatta._smooth.smoothedHeading;
      var diff = Math.abs(((newHeading - prev + 540) % 360) - 180);
      if(diff > 2 || smR.avg > 0.5) {
        SCKR.regatta._smooth.smoothedHeading = SCKR.core.util.emaHeading(
          prev, newHeading, smR.avg > 1 ? 0.25 : 0.15
        );
      }
    }
  }, 500);
})();

    var p = SCKR.core.gps.currentPos;

        var times = (d.hourly && d.hourly.time) || [];

          var dt = Math.abs(new Date(times[i]) - now);
          if(dt < bd) { bd = dt; bi = i; }

  /* Big compass with wind arrow + heading */
  digitalCompass: function(heading, windDir, twa) {
    var h = heading || 0;
    var w = (windDir !== null && windDir !== undefined) ? windDir : null;
    var dir = SCKR.core.fmt.compass(h);
    var wdir = w !== null ? SCKR.core.fmt.compass(w) : null;

    // Berechne TWA-Farbe
    var twaColor = "#AAAAAA";
    if(twa !== null && twa !== undefined) {
      twaColor = twa > 0 ? "#1AABA0" : "#e67e22";
    }

    // Ring-Arc fuer Heading-Richtung
    var arc = function(deg, r) {
      var rad = (deg - 90) * Math.PI / 180;
      return {x: 100 + r * Math.cos(rad), y: 100 + r * Math.sin(rad)};
    };
    var arcPath = function(fromDeg, toDeg, r) {
      var p1 = arc(fromDeg, r), p2 = arc(toDeg, r);
      var large = (toDeg - fromDeg + 360) % 360 > 180 ? 1 : 0;
      return "M"+p1.x.toFixed(1)+" "+p1.y.toFixed(1)+" A"+r+" "+r+" 0 "+large+" 1 "+p2.x.toFixed(1)+" "+p2.y.toFixed(1);
    };

    // Heading-Arc (20 Grad Bogen)
    var hArc = arcPath(h - 12, h + 12, 78);
    // Wind-Arc wenn vorhanden
    var wArc = w !== null ? arcPath(w - 8, w + 8, 68) : null;

    // Kardinalpunkte
    var cardinals = [
      {deg:0,  lbl:"N", bold:true},
      {deg:90, lbl:"O", bold:false},
      {deg:180,lbl:"S", bold:false},
      {deg:270,lbl:"W", bold:false}
    ];

    var svg = '<svg viewBox="0 0 200 200" width="100%" height="100%" style="max-width:300px;max-height:300px;display:block;margin:0 auto">';
    // Hintergrund
    svg += '<circle cx="100" cy="100" r="96" fill="#0d0d0d" stroke="rgba(255,255,255,.08)" stroke-width="1"/>';
    // Skalenring
    svg += '<circle cx="100" cy="100" r="82" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="12"/>';
    // Grad-Markierungen alle 30
    for(var deg=0; deg<360; deg+=30) {
      var p1 = arc(deg, 86), p2 = arc(deg, 76);
      svg += '<line x1="'+p1.x.toFixed(1)+'" y1="'+p1.y.toFixed(1)+'" x2="'+p2.x.toFixed(1)+'" y2="'+p2.y.toFixed(1)+'" stroke="rgba(255,255,255,.2)" stroke-width="1.5"/>';
    }
    // Grad-Markierungen alle 10
    for(var deg2=0; deg2<360; deg2+=10) {
      if(deg2 % 30 !== 0) {
        var p3 = arc(deg2, 86), p4 = arc(deg2, 80);
        svg += '<line x1="'+p3.x.toFixed(1)+'" y1="'+p3.y.toFixed(1)+'" x2="'+p4.x.toFixed(1)+'" y2="'+p4.y.toFixed(1)+'" stroke="rgba(255,255,255,.1)" stroke-width="1"/>';
      }

    // Heading-Arc (Vereinsfarbe / rot)
    svg += '<path d="'+hArc+'" fill="none" stroke="var(--acc,#C8102E)" stroke-width="10" stroke-linecap="round"/>';
    // Kardinalrichtungen
    for(var ci=0; ci<cardinals.length; ci++) {
      var cp = arc(cardinals[ci].deg, 60);
      svg += '<text x="'+cp.x.toFixed(1)+'" y="'+(cp.y+4).toFixed(1)+'" text-anchor="middle" fill="'+(cardinals[ci].bold?"#FFFFFF":"rgba(255,255,255,.5)")+'" font-family="Barlow Condensed" font-size="'+(cardinals[ci].bold?13:11)+'" font-weight="'+(cardinals[ci].bold?900:600)+'">'+cardinals[ci].lbl+'</text>';
    }
    // Zentrum: grosse Gradanzeige
    svg += '<text x="100" y="90" text-anchor="middle" fill="#FFFFFF" font-family="Barlow Condensed" font-size="38" font-weight="900" font-variant-numeric="tabular-nums">'+Math.round(h)+'</text>';
    svg += '<text x="100" y="110" text-anchor="middle" fill="rgba(255,255,255,.6)" font-family="Barlow Condensed" font-size="14" font-weight="700">'+dir+'</text>';
    // Wind-Info

      svg += '<text x="100" y="130" text-anchor="middle" fill="#1AABA0" font-family="Barlow Condensed" font-size="11" font-weight="700">Wind: '+wdir+'</text>';
    }
    // TWA
    if(twa !== null && twa !== undefined) {
      var twaStr = (twa > 0 ? "+" : "") + Math.round(twa) + "° " + (twa > 0 ? "BB" : twa < 0 ? "StB" : "");
      svg += '<text x="100" y="148" text-anchor="middle" fill="'+twaColor+'" font-family="Barlow Condensed" font-size="13" font-weight="800">TWA '+twaStr+'</text>';
    }
    svg += '</svg>';
    return svg;
  },
